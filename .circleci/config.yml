            node --test               e2e/dashboard-brand-delete-safety.test.mjs               e2e/dashboard-brands-mobile-actions.test.mjs               e2e/dashboard-category-image-pipeline.test.mjs               e2e/dashboard-collections-supabase.test.mjs               e2e/dashboard-content-cms-step4.test.mjs               e2e/dashboard-customers-supabase.test.mjs               e2e/dashboard-hero-composite-row-regression.test.mjs               e2e/dashboard-hero-image-pipeline.test.mjs               e2e/dashboard-hero-supabase.test.mjs               e2e/dashboard-home-supabase.test.mjs               e2e/dashboard-homepage-cms.test.mjs

  dashboard-group-c:
