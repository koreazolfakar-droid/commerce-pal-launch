            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: diag-unit-cart-orders
          command: node --test e2e/cart-*.test.mjs e2e/create-order-rate-limit-security.test.mjs e2e/storefront-orders-secure.test.mjs


