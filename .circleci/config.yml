version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

  prepare:
    steps:
      - checkout
      - install-bun
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  dashboard-group-a:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Dashboard auth and login tests
          command: |
            node --test               e2e/dashboard-auth0-security.test.mjs               e2e/dashboard-csp-session-ci.test.mjs               e2e/dashboard-login-route.test.mjs               e2e/dashboard-login-screen-capture.test.mjs               e2e/dashboard-login-ui.test.mjs               e2e/dashboard-passkey-client.test.mjs               e2e/dashboard-passkey-second-factor.test.mjs               e2e/dashboard-passkey-step-up.test.mjs               e2e/dashboard-password-breach-screening.test.mjs               e2e/dashboard-security-hardening.test.mjs               e2e/dashboard-session-security.test.mjs               e2e/dashboard-totp-mfa.test.mjs

  dashboard-group-b:
