version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

jobs:
  security-source:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: High-confidence source and secret scan
          command: |
            node scripts/security-gate.mjs
            node scripts/android-security-gate.mjs

  security-dependencies:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: High and critical dependency audit
          command: |
            source "$BASH_ENV"
            bun audit --audit-level=high

  storefront-ci:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-

      - install-bun

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

      - run:
          name: TypeScript
          command: bun run typecheck

      - run:
          name: ESLint
          command: bun run lint

      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

      - run:
          name: Unit and architecture tests
          command: bun run test:unit

      - run:
          name: Production build
          command: bun run build

      - run:
          name: SSR smoke test
          command: bun run test:ssr


  ui-browser-deps:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - install-bun
      - run:
          name: Install browser-test dependencies
          command: bun install --frozen-lockfile
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  ui-browser:
    parameters:
      engine:
        type: string
        default: chromium
      suite:
        type: string
        default: all
      route_group:
        type: string
        default: all
    docker:
      - image: cimg/node:lts
    resource_class: medium
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
      UI_ENGINE: << parameters.engine >>
      UI_SUITE: << parameters.suite >>
      UI_ROUTE_GROUP: << parameters.route_group >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install browser runtime
          command: ./node_modules/.bin/playwright install --with-deps << parameters.engine >>
      - run:
          name: Responsive multi-engine UI checks
          command: |
            ./node_modules/.bin/vite dev --host 0.0.0.0 --port 4173 > /tmp/ui-polish-vite.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            READY=0
            for _ in {1..60}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              cat /tmp/ui-polish-vite.log
              exit 1
            fi
            E2E_BASE_URL=http://127.0.0.1:4173 node e2e/ui-polish-responsive-check.mjs


  ui-server-smoke:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Start UI server and verify homepage
          command: |
            bun run dev:e2e --host 0.0.0.0 --port 4173 > /tmp/ui-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            READY=0
            for _ in {1..60}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /tmp/ui-home.html; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              cat /tmp/ui-server.log
              exit 1
            fi
            test -s /tmp/ui-home.html


  ui-playwright-image-smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    resource_class: small
    working_directory: ~/project
    steps:
      - run:
          name: Verify Playwright image runtime
          command: |
            node --version
            test -d /ms-playwright

  android-build:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    environment:
      GRADLE_VERSION: "9.6.0"
      GRADLE_BIN_SHA256: "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
    steps:
      - checkout

      - run:
          name: Verify Android build environment
          command: |
            set -euo pipefail
            java -version
            sdkmanager --version

      - run:
          name: Install Android API 36 and Build Tools 36.0.0
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - restore_cache:
          keys:
            - android-gradle-v1-{{ checksum "android/build.gradle" }}-{{ checksum "android/app/build.gradle" }}
            - android-gradle-v1-

      - run:
          name: Install Gradle 9.6.0
          command: |
            set -euo pipefail
            curl --proto '=https' --tlsv1.2 -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            echo "${GRADLE_BIN_SHA256}  /tmp/gradle.zip" | sha256sum -c -
            rm -rf "$HOME/gradle-${GRADLE_VERSION}"
            unzip -q /tmp/gradle.zip -d "$HOME"
            echo "export PATH=\"$HOME/gradle-${GRADLE_VERSION}/bin:$PATH\"" >> "$BASH_ENV"
            source "$BASH_ENV"
            gradle --version

      - run:
          name: Configure optional release signing
          command: |
            set -euo pipefail
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
               [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
               [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
               [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/space-call-upload.jks
              chmod 600 /tmp/space-call-upload.jks

              CERT_SHA256="$(keytool -list -v \
                -keystore /tmp/space-call-upload.jks \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                -alias "$ANDROID_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')"

              test -n "$CERT_SHA256"
              echo 'export ANDROID_KEYSTORE_PATH=/tmp/space-call-upload.jks' >> "$BASH_ENV"
              echo 'export SPACE_CALL_SIGNED_BUILD=1' >> "$BASH_ENV"
              echo "export ANDROID_CERT_SHA256=$CERT_SHA256" >> "$BASH_ENV"
            else
              echo 'export SPACE_CALL_SIGNED_BUILD=0' >> "$BASH_ENV"
            fi

      - run:
          name: Validate security and build Android app
          command: |
            set -euo pipefail
            source "$BASH_ENV"

            jq empty public/manifest.webmanifest
            grep -q 'rel: "manifest"' src/routes/__root.tsx

            cd android
            gradle --no-daemon :app:lintRelease
            gradle --no-daemon :app:assembleDebug
            cd ..

            if [ "$SPACE_CALL_SIGNED_BUILD" = "1" ]; then
              test -f public/.well-known/assetlinks.json
              jq -e --arg fp "$ANDROID_CERT_SHA256" '
                any(.[];
                  .target.namespace == "android_app" and
                  .target.package_name == "store.spacecallapp.app" and
                  (.target.sha256_cert_fingerprints | index($fp))
                )
              ' public/.well-known/assetlinks.json >/dev/null

              cd android
              gradle --no-daemon :app:assembleRelease
              gradle --no-daemon :app:bundleRelease
              cd ..
            fi

      - save_cache:
          key: android-gradle-v1-{{ checksum "android/build.gradle" }}-{{ checksum "android/app/build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/notifications

      - run:
          name: Package APK and AAB artifacts
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            mkdir -p dist/android

            cp android/app/build/outputs/apk/debug/app-debug.apk               dist/android/Space-Call-1.0.0-debug.apk

            if [ "$SPACE_CALL_SIGNED_BUILD" = "1" ]; then
              cp android/app/build/outputs/apk/release/app-release.apk \
                dist/android/Space-Call-1.0.0-release.apk
              cp android/app/build/outputs/bundle/release/app-release.aab \
                dist/android/Space-Call-1.0.0-release.aab
              cp public/.well-known/assetlinks.json \
                dist/android/assetlinks.json
            else
              printf '%s\n' \
                'Debug APK only: release APK/AAB generation is intentionally blocked.' \
                'Configure the persistent signing key and verified Digital Asset Links before Play Store release.' \
                > dist/android/RELEASE-BLOCKED-UNTIL-SIGNED.txt
            fi

            (
              cd dist/android
              sha256sum Space-Call-* > SHA256SUMS.txt
            )

      - run:
          name: Publish APK to stable GitHub Release
          command: |
            set -euo pipefail
            source "$BASH_ENV"

            if [ -z "${GITHUB_RELEASE_TOKEN:-}" ]; then
              echo "GITHUB_RELEASE_TOKEN is not configured; skipping GitHub Release upload."
              exit 0
            fi

            REPO="koreazolfakar-droid/commerce-pal-launch"
            TAG="android-latest"
            RELEASE_NAME="Space Call Android — Latest Test Build"
            API="https://api.github.com/repos/$REPO"
            AUTH_HEADER="Authorization: Bearer $GITHUB_RELEASE_TOKEN"
            API_VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

            if [ "$SPACE_CALL_SIGNED_BUILD" = "1" ]; then
              APK_PATH="dist/android/Space-Call-1.0.0-release.apk"
              APK_NAME="Space-Call-latest.apk"
            else
              APK_PATH="dist/android/Space-Call-1.0.0-debug.apk"
              APK_NAME="Space-Call-latest-debug.apk"
            fi

            TAG_STATUS="$(curl -sS -o /tmp/tag.json -w '%{http_code}' \
              -H "$AUTH_HEADER" \
              -H "$API_VERSION_HEADER" \
              -H "Accept: application/vnd.github+json" \
              "$API/git/ref/tags/$TAG")"

            if [ "$TAG_STATUS" = "200" ]; then
              curl -fsS -X PATCH \
                -H "$AUTH_HEADER" \
                -H "$API_VERSION_HEADER" \
                -H "Accept: application/vnd.github+json" \
                "$API/git/refs/tags/$TAG" \
                -d "$(jq -nc --arg sha "$CIRCLE_SHA1" '{sha:$sha,force:true}')" \
                >/tmp/tag-update.json
            elif [ "$TAG_STATUS" = "404" ]; then
              curl -fsS -X POST \
                -H "$AUTH_HEADER" \
                -H "$API_VERSION_HEADER" \
                -H "Accept: application/vnd.github+json" \
                "$API/git/refs" \
                -d "$(jq -nc --arg ref "refs/tags/$TAG" --arg sha "$CIRCLE_SHA1" '{ref:$ref,sha:$sha}')" \
                >/tmp/tag-create.json
            else
              echo "Unexpected GitHub tag API status: $TAG_STATUS"
              cat /tmp/tag.json
              exit 1
            fi

            RELEASE_STATUS="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
              -H "$AUTH_HEADER" \
              -H "$API_VERSION_HEADER" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases/tags/$TAG")"

            if [ "$RELEASE_STATUS" = "200" ]; then
              RELEASE_ID="$(jq -r '.id' /tmp/release.json)"
              curl -fsS -X PATCH \
                -H "$AUTH_HEADER" \
                -H "$API_VERSION_HEADER" \
                -H "Accept: application/vnd.github+json" \
                "$API/releases/$RELEASE_ID" \
                -d "$(jq -nc \
                  --arg name "$RELEASE_NAME" \
                  --arg body "Automatically published by CircleCI from commit $CIRCLE_SHA1. This release is replaced after each successful Android build." \
                  '{name:$name,body:$body,prerelease:true,draft:false}')" \
                >/tmp/release-update.json
            elif [ "$RELEASE_STATUS" = "404" ]; then
              curl -fsS -X POST \
                -H "$AUTH_HEADER" \
                -H "$API_VERSION_HEADER" \
                -H "Accept: application/vnd.github+json" \
                "$API/releases" \
                -d "$(jq -nc \
                  --arg tag "$TAG" \
                  --arg name "$RELEASE_NAME" \
                  --arg target "$CIRCLE_SHA1" \
                  --arg body "Automatically published by CircleCI from commit $CIRCLE_SHA1. This release is replaced after each successful Android build." \
                  '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,prerelease:true,draft:false}')" \
                >/tmp/release-create.json
              RELEASE_ID="$(jq -r '.id' /tmp/release-create.json)"
            else
              echo "Unexpected GitHub release API status: $RELEASE_STATUS"
              cat /tmp/release.json
              exit 1
            fi

            curl -fsS \
              -H "$AUTH_HEADER" \
              -H "$API_VERSION_HEADER" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases/$RELEASE_ID/assets?per_page=100" \
              >/tmp/assets.json

            for ASSET_NAME in "$APK_NAME" "SHA256SUMS.txt"; do
              ASSET_ID="$(jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .id' /tmp/assets.json | head -n1)"
              if [ -n "$ASSET_ID" ]; then
                curl -fsS -X DELETE \
                  -H "$AUTH_HEADER" \
                  -H "$API_VERSION_HEADER" \
                  -H "Accept: application/vnd.github+json" \
                  "$API/releases/assets/$ASSET_ID"
              fi
            done

            curl -fsS -X POST \
              -H "$AUTH_HEADER" \
              -H "$API_VERSION_HEADER" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK_PATH" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$APK_NAME" \
              >/tmp/apk-upload.json

            curl -fsS -X POST \
              -H "$AUTH_HEADER" \
              -H "$API_VERSION_HEADER" \
              -H "Content-Type: text/plain" \
              --data-binary "@dist/android/SHA256SUMS.txt" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
              >/tmp/checksum-upload.json

            echo "Published $APK_NAME to GitHub Release tag $TAG."

      - store_artifacts:
          path: dist/android
          destination: space-call-android

workflows:
  security-and-storefront-validation:
    jobs:
      - android-build:
          filters:
            branches:
              only:
                - feat/android-twa-app
      - storefront-ci:
          name: storefront-android-branch
          filters:
            branches:
              only:
                - feat/android-twa-app
      - security-source
      - security-dependencies
      - ui-browser-deps:
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-overflow-mobile-en
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-no-hero-container
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en-no-hero-container
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-contain-hero
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en-contain-hero
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-hide-hero-scene
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en-hide-hero-scene
          filters:
            branches:
              only:
                - /^ui\/.*/
