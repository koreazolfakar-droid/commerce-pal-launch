version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

jobs:
  security-source:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: High-confidence source and secret scan
          command: node scripts/security-gate.mjs

  security-dependencies:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: High and critical dependency audit
          command: |
            source "$BASH_ENV"
            bun audit --audit-level=high

  storefront-ci:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-

      - install-bun

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

      - run:
          name: TypeScript
          command: bun run typecheck

      - run:
          name: ESLint
          command: bun run lint

      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

      - run:
          name: Unit and architecture tests
          command: bun run test:unit

      - run:
          name: Production build
          command: bun run build

      - run:
          name: SSR smoke test
          command: bun run test:ssr

  diag-typecheck:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript diagnostic
          command: bun run typecheck

  diag-unit:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Unit diagnostic
          command: bun run test:unit

  diag-unit-architecture:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Architecture diagnostic
          command: node --test e2e/architecture.test.mjs

  diag-unit-performance:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Performance architecture diagnostic
          command: node --test e2e/performance-architecture.test.mjs

  diag-unit-rest:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Remaining unit diagnostics
          command: |
            find e2e -maxdepth 1 -name '*.test.mjs' ! -name 'architecture.test.mjs' ! -name 'performance-architecture.test.mjs' -print0 | sort -z | xargs -0 node --test

  diag-type-routes:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript path diagnostic
          command: |
            set +e
            bun run typecheck > /tmp/typecheck.log 2>&1
            set -e
            if grep -Eq '(^|[ (])src/routes/' /tmp/typecheck.log; then
              exit 1
            fi
            exit 0


  diag-type-components:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript path diagnostic
          command: |
            set +e
            bun run typecheck > /tmp/typecheck.log 2>&1
            set -e
            if grep -Eq '(^|[ (])src/components/' /tmp/typecheck.log; then
              exit 1
            fi
            exit 0


  diag-type-dashboard:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript path diagnostic
          command: |
            set +e
            bun run typecheck > /tmp/typecheck.log 2>&1
            set -e
            if grep -Eq '(^|[ (])src/dashboard/' /tmp/typecheck.log; then
              exit 1
            fi
            exit 0


  diag-type-lib:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript path diagnostic
          command: |
            set +e
            bun run typecheck > /tmp/typecheck.log 2>&1
            set -e
            if grep -Eq '(^|[ (])src/(lib|integrations|hooks|stores)/' /tmp/typecheck.log; then
              exit 1
            fi
            exit 0

workflows:
  security-and-storefront-validation:
    jobs:
      - security-source
      - security-dependencies
      - storefront-ci:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-typecheck:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-unit:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-unit-architecture:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-unit-performance:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-unit-rest:
          filters:
            branches:
              only:
                - /^important\/.*/

      - diag-type-routes:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-type-components:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-type-dashboard:
          filters:
            branches:
              only:
                - /^important\/.*/
      - diag-type-lib:
          filters:
            branches:
              only:
                - /^important\/.*/
