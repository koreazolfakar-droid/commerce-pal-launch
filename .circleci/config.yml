version: 2.1

executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

  restore-project:
    steps:
      - checkout
      - install-bun
      - attach_workspace:
          at: ~/project

jobs:
  setup:
    executor: node-bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v2-{{ checksum "bun.lock" }}
            - bun-deps-v2-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v2-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - node_modules

  typecheck:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: TypeScript
          command: bun run typecheck

  lint:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: ESLint
          command: bun run lint

  dashboard-tests:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

  unit-tests:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Unit and architecture tests
          command: bun run test:unit

  build:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Production build
          command: bun run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .output

  ssr:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: SSR smoke test
          command: bun run test:ssr

workflows:
  storefront-validation:
    jobs:
      - setup:
          filters:
            branches:
              only:
                - /^important\/.*/
      - typecheck:
          requires: [setup]
      - lint:
          requires: [setup]
      - dashboard-tests:
          requires: [setup]
      - unit-tests:
          requires: [setup]
      - build:
          requires: [setup]
      - ssr:
          requires: [build]
