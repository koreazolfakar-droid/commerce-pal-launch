version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  prepare:
    steps:
      - checkout
      - install-bun
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  dashboard-auth-a1:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Auth0 and CSP tests
          command: |
            node --test               e2e/dashboard-auth0-security.test.mjs               e2e/dashboard-csp-session-ci.test.mjs

  dashboard-auth-a2:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Login route and screen capture tests
          command: |
            node --test               e2e/dashboard-login-route.test.mjs               e2e/dashboard-login-screen-capture.test.mjs

  core-b1:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Catalog and cleanup tests
          command: |
            node --test               e2e/catalog-management-responsive.test.mjs               e2e/catalog.test.mjs               e2e/category-cleanup-followup.test.mjs

  core-b2:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Category and CI tests
          command: |
            node --test               e2e/category-page-premium.test.mjs               e2e/category-storefront-sync.test.mjs               e2e/category-taxonomy-cleanup.test.mjs               e2e/ci-config.test.mjs

workflows:
  isolate-current-test-failures-stage-3:
    jobs:
      - dashboard-auth-a1
      - dashboard-auth-a2
      - core-b1
      - core-b2
