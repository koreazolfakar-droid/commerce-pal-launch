version: 2.1
executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
jobs:
  check-type:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: Typecheck, command: "bun run typecheck" }
  check-lint:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: Lint, command: "bun run lint" }
  check-unit:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: Unit, command: "bun run test:unit" }
  check-build:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: Build, command: "bun run build" }
  check-ssr:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: SSR, command: "bun run test:ssr" }
workflows:
  diagnose:
    jobs:
      - check-type
      - check-lint
      - check-unit
      - check-build
      - check-ssr
