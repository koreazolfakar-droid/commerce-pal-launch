  baseline-architecture:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - run:
          name: Reset to PR base
          command: git reset --hard 53ee1552dc3351e8b4d2fe8a6241d39333209c32
      - install-bun
      - run:
          name: Install base dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Base architecture test
          command: node --test e2e/architecture.test.mjs

  baseline-product:
    docker:
      - image: cimg/node:lts
    resource_class: small
