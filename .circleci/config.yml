version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

  install-project:
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  security-source:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: High-confidence source and secret scan
          command: node scripts/security-gate.mjs

  security-dependencies:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: High and critical dependency audit
          command: |
            source "$BASH_ENV"
            bun audit --audit-level=high

  storefront-ci:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-

      - install-bun

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

      - run:
          name: TypeScript
          command: bun run typecheck

      - run:
          name: ESLint
          command: bun run lint

      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

      - run:
          name: Unit and architecture tests
          command: bun run test:unit

      - run:
          name: Production build
          command: bun run build

      - run:
          name: SSR smoke test
          command: bun run test:ssr

  visual-typecheck:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: TypeScript
          command: bun run typecheck

  visual-lint:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: ESLint
          command: bun run lint

  visual-unit:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Unit and architecture tests
          command: bun run test:unit

  visual-unit-dashboard:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Dashboard unit tests
          command: node --test e2e/dashboard-*.test.mjs

  visual-unit-cart:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Cart and order unit tests
          command: |
            shopt -s nullglob
            files=(e2e/cart-*.test.mjs e2e/storefront-orders-secure.test.mjs)
            node --test "${files[@]}"

  visual-unit-storefront:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Storefront architecture unit tests
          command: |
            shopt -s nullglob
            files=(
              e2e/architecture.test.mjs
              e2e/performance-architecture.test.mjs
              e2e/storefront-*.test.mjs
              e2e/customer-auth-ui.test.mjs
              e2e/category-*.test.mjs
              e2e/product-*.test.mjs
              e2e/seo-regression.test.mjs
              e2e/visual-system-regression.test.mjs
            )
            node --test "${files[@]}"

  visual-unit-architecture:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Architecture unit tests
          command: node --test e2e/architecture.test.mjs e2e/performance-architecture.test.mjs

  visual-unit-architecture-core:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Architecture core test
          command: node --test e2e/architecture.test.mjs

  visual-unit-performance:
