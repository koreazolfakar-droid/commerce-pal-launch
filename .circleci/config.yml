version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  prepare:
    steps:
      - checkout
      - install-bun
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  test-dashboard-auth0:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run: node --test e2e/dashboard-auth0-security.test.mjs

  test-dashboard-csp:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run: node --test e2e/dashboard-csp-session-ci.test.mjs

  test-category-page:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run: node --test e2e/category-page-premium.test.mjs

  test-category-sync:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run: node --test e2e/category-storefront-sync.test.mjs

  test-category-taxonomy:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run: node --test e2e/category-taxonomy-cleanup.test.mjs

  test-ci-config:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run: node --test e2e/ci-config.test.mjs

workflows:
  isolate-exact-current-test-failures:
    jobs:
      - test-dashboard-auth0
      - test-dashboard-csp
      - test-category-page
      - test-category-sync
      - test-category-taxonomy
      - test-ci-config
