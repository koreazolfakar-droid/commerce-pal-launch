version: 2.1

executors:
  bun-node:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  setup-project:
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

jobs:
  dead-code-reference-check:
    executor: bun-node
    steps:
      - checkout
      - run:
          name: Verify PromoBanners is unreachable
          command: |
            test ! -e src/components/PromoBanners.tsx
            ! grep -R --line-number --fixed-strings "@/components/PromoBanners" src e2e || exit 1
            ! grep -R --line-number --fixed-strings "PromoSlot" src e2e || exit 1
            ! grep -R --line-number --fixed-strings "import.meta.glob" src || exit 1

  production-build:
    executor: bun-node
    steps:
      - setup-project
      - run:
          name: Production build
          command: bun run build

  unit-architecture:
    executor: bun-node
    steps:
      - setup-project
      - run:
          name: Unit and architecture tests
          command: bun run test:unit

  ssr-smoke:
    executor: bun-node
    steps:
      - setup-project
      - run:
          name: Production build
          command: bun run build
      - run:
          name: SSR smoke test
          command: bun run test:ssr

workflows:
  dead-code-validation:
    jobs:
      - dead-code-reference-check:
          filters:
            branches:
              only:
                - /^important\/dead-code-step-1-diagnostics$/
      - production-build:
          filters:
            branches:
              only:
                - /^important\/dead-code-step-1-diagnostics$/
      - unit-architecture:
          filters:
            branches:
              only:
                - /^important\/dead-code-step-1-diagnostics$/
      - ssr-smoke:
          filters:
            branches:
              only:
                - /^important\/dead-code-step-1-diagnostics$/
