version: 2.1

commands:
  setup_bun:
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  diagnostic-dashboard-tests:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: Dashboard tests
          command: node --test e2e/dashboard-*.test.mjs

  diagnostic-build-smoke:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: Production build
          command: bun run build
      - run:
          name: SSR smoke
          command: bun run test:ssr

workflows:
  diagnostic-validation:
    jobs:
      - diagnostic-dashboard-tests:
          filters:
            branches:
              only:
                - /^important\/security-baseline-main-20260920$/
      - diagnostic-build-smoke:
          filters:
            branches:
              only:
                - /^important\/security-baseline-main-20260920$/
