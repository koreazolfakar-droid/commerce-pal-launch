version: 2.1

commands:
  setup_bun:
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  security-static:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: TypeScript
          command: bun run typecheck
      - run:
          name: Lint changed security files
          command: |
            bun x eslint --fix-dry-run \
              src/dashboard/components/auth/DashboardMfaStep.tsx \
              src/dashboard/data/catalog.ts \
              src/dashboard/pages/LoginPage.tsx \
              supabase/functions/dashboard-auth-throttle/index.ts \
              supabase/functions/dashboard-passkey-stepup/index.ts \
              supabase/functions/dashboard-update-password/index.ts \
              e2e/dashboard-login-ui.test.mjs \
              e2e/dashboard-passkey-client.test.mjs \
              e2e/dashboard-passkey-second-factor.test.mjs \
              e2e/dashboard-password-breach-screening.test.mjs \
              e2e/dashboard-security-hardening.test.mjs

  security-tests:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: Focused auth and security tests
          command: |
            node --test \
              e2e/dashboard-login-route.test.mjs \
              e2e/dashboard-login-ui.test.mjs \
              e2e/dashboard-passkey-client.test.mjs \
              e2e/dashboard-passkey-second-factor.test.mjs \
              e2e/dashboard-passkey-step-up.test.mjs \
              e2e/dashboard-password-breach-screening.test.mjs \
              e2e/dashboard-security-hardening.test.mjs \
              e2e/dashboard-session-security.test.mjs \
              e2e/dashboard-totp-mfa.test.mjs

  security-build-smoke:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: Production build
          command: bun run build
      - run:
          name: SSR smoke
          command: bun run test:ssr

workflows:
  security-diagnostic:
    jobs:
      - security-static:
          filters:
            branches:
              only:
                - /^important\/security-pr-diagnostic-20260920$/
      - security-tests:
          filters:
            branches:
              only:
                - /^important\/security-pr-diagnostic-20260920$/
      - security-build-smoke:
          filters:
            branches:
              only:
                - /^important\/security-pr-diagnostic-20260920$/
