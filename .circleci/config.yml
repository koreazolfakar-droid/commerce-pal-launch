            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: diag-unit-dashboard
          command: find e2e -maxdepth 1 -name 'dashboard-*.test.mjs' ! -name 'dashboard-csp-session-ci.test.mjs' -print0 | sort -z | xargs -0 node --test

workflows:
  unit-diagnostics:
    jobs:
      - diag-unit-architecture
      - diag-unit-cart-orders
      - diag-unit-catalog-category
      - diag-unit-storefront
      - diag-unit-dashboard
