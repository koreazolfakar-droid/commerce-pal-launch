version: 2.1

executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  restore-project:
    steps:
      - checkout
      - install-bun
      - attach_workspace:
          at: ~/project

jobs:
  setup:
    executor: node-bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v2-{{ checksum "bun.lock" }}
            - bun-deps-v2-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v2-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - node_modules

  tsc-catalog:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Catalog TypeScript
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            set -e
            grep -E 'src/dashboard/data/catalog\.ts' /tmp/tsc.log >/dev/null && exit 1 || exit 0

  tsc-receiving:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Receiving TypeScript
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            set -e
            grep -E 'src/dashboard/data/receiving\.ts' /tmp/tsc.log >/dev/null && exit 1 || exit 0

  tsc-other-data-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Other data A TypeScript
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            set -e
            grep -E 'src/dashboard/data/(brands|categories|collections|customers|hero|home|homepage)\.ts' /tmp/tsc.log >/dev/null && exit 1 || exit 0

  tsc-other-data-b:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Other data B TypeScript
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            set -e
            grep -E 'src/dashboard/data/(homepagePreview|homepageSections|media|navigation|orders|productManagement|receivingRules|seo|settings|workspace)\.ts' /tmp/tsc.log >/dev/null && exit 1 || exit 0

  test-auth0-security:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: auth0-security
          command: node --test e2e/dashboard-auth0-security.test.mjs

