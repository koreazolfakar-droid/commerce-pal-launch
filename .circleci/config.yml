version: 2.1

commands:
  android-lint-toolchain:
    steps:
      - run:
          name: Install Android lint toolchain
          command: |
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
            curl --proto '=https' --tlsv1.2 -fsSL               "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"               -o /tmp/gradle.zip
            echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  /tmp/gradle.zip" | sha256sum -c -
            rm -rf "$HOME/gradle-9.6.0"
            unzip -q /tmp/gradle.zip -d "$HOME"
            echo 'export PATH="$HOME/gradle-9.6.0/bin:$PATH"' >> "$BASH_ENV"

jobs:
  lint-control:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - android-lint-toolchain
      - run:
          name: Control lint with no suppressions
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd android
            gradle --no-daemon --stacktrace :app:lintDebug

  lint-probe-applinks:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - android-lint-toolchain
      - run:
          name: Probe App Links lint family
          command: |
            set -euo pipefail
            cat > android/app/lint.xml <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <lint>
              <issue id="AppLinkUrlError" severity="ignore" />
              <issue id="AppLinkSplitToWebAndCustom" severity="ignore" />
              <issue id="AppLinksAutoVerify" severity="ignore" />
              <issue id="MissingAutoVerifyAttribute" severity="ignore" />
              <issue id="IntentFilterUniqueDataAttributes" severity="ignore" />
            </lint>
            EOF
            source "$BASH_ENV"
            cd android
            gradle --no-daemon --stacktrace :app:lintDebug

  lint-probe-backup-manifest:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - android-lint-toolchain
      - run:
          name: Probe backup and manifest lint family
          command: |
            set -euo pipefail
            cat > android/app/lint.xml <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <lint>
              <issue id="FullBackupContent" severity="ignore" />
              <issue id="DataExtractionRules" severity="ignore" />
              <issue id="ExportedService" severity="ignore" />
              <issue id="ExportedReceiver" severity="ignore" />
              <issue id="ExportedContentProvider" severity="ignore" />
              <issue id="MissingApplicationIcon" severity="ignore" />
              <issue id="Instantiatable" severity="ignore" />
            </lint>
            EOF
            source "$BASH_ENV"
            cd android
            gradle --no-daemon --stacktrace :app:lintDebug

  lint-probe-api-security:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - android-lint-toolchain
      - run:
          name: Probe API and permission lint family
          command: |
            set -euo pipefail
            cat > android/app/lint.xml <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <lint>
              <issue id="MissingPermission" severity="ignore" />
              <issue id="CoarseFineLocation" severity="ignore" />
              <issue id="NewApi" severity="ignore" />
              <issue id="InlinedApi" severity="ignore" />
              <issue id="UnsafeImplicitIntentLaunch" severity="ignore" />
              <issue id="QueryPermissionsNeeded" severity="ignore" />
              <issue id="WrongConstant" severity="ignore" />
            </lint>
            EOF
            source "$BASH_ENV"
            cd android
            gradle --no-daemon --stacktrace :app:lintDebug

  lint-probe-all-suspects:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - android-lint-toolchain
      - run:
          name: Probe all likely blocking lint families
          command: |
            set -euo pipefail
            cat > android/app/lint.xml <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <lint>
              <issue id="AppLinkUrlError" severity="ignore" />
              <issue id="AppLinkSplitToWebAndCustom" severity="ignore" />
              <issue id="AppLinksAutoVerify" severity="ignore" />
              <issue id="MissingAutoVerifyAttribute" severity="ignore" />
              <issue id="IntentFilterUniqueDataAttributes" severity="ignore" />
              <issue id="FullBackupContent" severity="ignore" />
              <issue id="DataExtractionRules" severity="ignore" />
              <issue id="ExportedService" severity="ignore" />
              <issue id="ExportedReceiver" severity="ignore" />
              <issue id="ExportedContentProvider" severity="ignore" />
              <issue id="MissingApplicationIcon" severity="ignore" />
              <issue id="Instantiatable" severity="ignore" />
              <issue id="MissingPermission" severity="ignore" />
              <issue id="CoarseFineLocation" severity="ignore" />
              <issue id="NewApi" severity="ignore" />
              <issue id="InlinedApi" severity="ignore" />
              <issue id="UnsafeImplicitIntentLaunch" severity="ignore" />
              <issue id="QueryPermissionsNeeded" severity="ignore" />
              <issue id="WrongConstant" severity="ignore" />
            </lint>
            EOF
            source "$BASH_ENV"
            cd android
            gradle --no-daemon --stacktrace :app:lintDebug

workflows:
  android-lint-probes:
    jobs:
      - lint-control
      - lint-probe-applinks
      - lint-probe-backup-manifest
      - lint-probe-api-security
      - lint-probe-all-suspects
