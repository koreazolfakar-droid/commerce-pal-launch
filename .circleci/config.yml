version: 2.1

commands:
  setup_bun:
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  diagnostic-auth-tests:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: Auth and security dashboard tests
          command: |
            node --test \
              e2e/dashboard-auth0-security.test.mjs \
              e2e/dashboard-login-route.test.mjs \
              e2e/dashboard-login-screen-capture.test.mjs \
              e2e/dashboard-login-ui.test.mjs \
              e2e/dashboard-passkey-client.test.mjs \
              e2e/dashboard-passkey-second-factor.test.mjs \
              e2e/dashboard-passkey-step-up.test.mjs \
              e2e/dashboard-password-breach-screening.test.mjs \
              e2e/dashboard-security-hardening.test.mjs \
              e2e/dashboard-session-security.test.mjs \
              e2e/dashboard-totp-mfa.test.mjs

  diagnostic-feature-tests:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - setup_bun
      - run:
          name: Non-auth dashboard tests
          command: |
            node --test \
              e2e/dashboard-category-image-pipeline.test.mjs \
              e2e/dashboard-collections-supabase.test.mjs \
              e2e/dashboard-content-cms-step4.test.mjs \
              e2e/dashboard-customers-supabase.test.mjs \
              e2e/dashboard-hero-image-pipeline.test.mjs \
              e2e/dashboard-hero-supabase.test.mjs \
              e2e/dashboard-home-supabase.test.mjs \
              e2e/dashboard-homepage-cms.test.mjs \
              e2e/dashboard-live-workspace.test.mjs \
              e2e/dashboard-orders-supabase.test.mjs \
              e2e/dashboard-procurement-schema-step2.test.mjs \
              e2e/dashboard-product-image-metadata.test.mjs \
              e2e/dashboard-product-management-step5.test.mjs \
              e2e/dashboard-receiving-rules.test.mjs \
              e2e/dashboard-receiving-workflow.test.mjs \
              e2e/dashboard-settings-supabase.test.mjs \
              e2e/dashboard-supabase-source-guard.test.mjs \
              e2e/dashboard-truthful-shell.test.mjs

workflows:
  diagnostic-validation:
    jobs:
      - diagnostic-auth-tests:
          filters:
            branches:
              only:
                - /^important\/security-baseline-main-20260920$/
      - diagnostic-feature-tests:
          filters:
            branches:
              only:
                - /^important\/security-baseline-main-20260920$/
