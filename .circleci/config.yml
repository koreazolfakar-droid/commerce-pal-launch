version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

jobs:

  diag-ts-route-dashboard:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: diag-ts-route-dashboard
          command: |
            set +e
            bun run typecheck > /tmp/typecheck.log 2>&1
            set -e
            matches="$(grep -E 'src/routes/dashboard' /tmp/typecheck.log || true)"
            
            if [ -n "$matches" ]; then exit 1; fi
            exit 0


  diag-ts-route-storefront:
    docker:
      - image: cimg/node:lts
