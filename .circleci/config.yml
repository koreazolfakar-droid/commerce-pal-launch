version: 2.1
executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  restore-project:
    steps:
      - checkout
      - install-bun
      - attach_workspace:
          at: ~/project
  tsc-match:
    parameters:
      pattern:
        type: string
    steps:
      - run:
          name: Scoped TypeScript diagnostic
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            grep -E '<< parameters.pattern >>' /tmp/tsc.log >/dev/null && exit 1
            exit 0
jobs:
  setup:
    executor: node-bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v2-{{ checksum "bun.lock" }}
            - bun-deps-v2-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v2-{{ checksum "bun.lock" }}
          paths: [~/.bun/install/cache]
      - persist_to_workspace:
          root: ~/project
          paths: [node_modules]

  tsc-catalog:
    executor: node-bun
    steps: [restore-project, { tsc-match: { pattern: 'src/dashboard/data/catalog\.ts' } }]
  tsc-inventory:
    executor: node-bun
    steps: [restore-project, { tsc-match: { pattern: 'src/dashboard/data/inventory\.ts' } }]
  tsc-receiving:
    executor: node-bun
    steps: [restore-project, { tsc-match: { pattern: 'src/dashboard/data/receiving\.ts' } }]
  tsc-other-data:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: Other dashboard data TypeScript diagnostic
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            grep -E 'src/dashboard/data/' /tmp/tsc.log | grep -Ev '(catalog|inventory|receiving)\.ts' >/dev/null && exit 1
            exit 0

  lint-pages-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: ./node_modules/.bin/eslint src/dashboard/pages/BrandsPage.tsx src/dashboard/pages/CategoriesPage.tsx src/dashboard/pages/CollectionDetailPage.tsx src/dashboard/pages/CollectionsPage.tsx src/dashboard/pages/CustomerDetailPage.tsx src/dashboard/pages/CustomersPage.tsx src/dashboard/pages/DashboardHomePage.tsx src/dashboard/pages/HeroBannersPage.tsx src/dashboard/pages/HomepageBuilder.tsx src/dashboard/pages/InventoryManagerPage.tsx src/dashboard/pages/LoginPage.tsx src/dashboard/pages/MediaLibraryPage.tsx src/dashboard/pages/NavigationPage.tsx src/dashboard/pages/NotFound.tsx src/dashboard/pages/OrderDetailPage.tsx --fix-dry-run
  lint-pages-b:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: ./node_modules/.bin/eslint src/dashboard/pages/OrdersPage.tsx src/dashboard/pages/ProcurementAnalyticsPage.tsx src/dashboard/pages/ProductFormPage.tsx src/dashboard/pages/ProductsPage.tsx src/dashboard/pages/PurchaseOrderCreatePage.tsx src/dashboard/pages/PurchaseOrderDetailPage.tsx src/dashboard/pages/PurchaseOrderEditPage.tsx src/dashboard/pages/PurchaseOrdersPage.tsx src/dashboard/pages/ReceivingDetailPage.tsx src/dashboard/pages/ReceivingPage.tsx src/dashboard/pages/SecurityPage.tsx src/dashboard/pages/SeoPage.tsx src/dashboard/pages/SettingsPage.tsx src/dashboard/pages/SuppliersPage.tsx src/dashboard/pages/WorkspacePage.tsx --fix-dry-run
  lint-other-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: ./node_modules/.bin/eslint src/dashboard/App.tsx src/dashboard/AppMount.tsx src/dashboard/i18n.ts src/dashboard/config src/dashboard/contexts --fix-dry-run
  lint-other-b:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: ./node_modules/.bin/eslint src/dashboard/hooks src/dashboard/lib src/dashboard/security --fix-dry-run

  auth-a1:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-auth0-security.test.mjs e2e/dashboard-csp-session-ci.test.mjs" } }]
  auth-a2:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-login-route.test.mjs e2e/dashboard-login-screen-capture.test.mjs" } }]
  auth-b1:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-login-ui.test.mjs e2e/dashboard-password-breach-screening.test.mjs" } }]
  auth-b2:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-security-hardening.test.mjs e2e/dashboard-session-security.test.mjs e2e/dashboard-totp-mfa.test.mjs" } }]

  cat-a1:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-category-image-pipeline.test.mjs e2e/dashboard-collections-supabase.test.mjs" } }]
  cat-a2:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-content-cms-step4.test.mjs e2e/dashboard-hero-image-pipeline.test.mjs e2e/dashboard-hero-supabase.test.mjs" } }]
  cat-b1:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-home-supabase.test.mjs e2e/dashboard-homepage-cms.test.mjs" } }]
  cat-b2:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/dashboard-product-image-metadata.test.mjs e2e/dashboard-product-management-step5.test.mjs e2e/dashboard-settings-supabase.test.mjs" } }]

  non-a1:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/architecture.test.mjs e2e/catalog.test.mjs e2e/cms-refresh.test.mjs" } }]
  non-a2:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/hybrid-storefront.test.mjs e2e/inventory-supabase.test.mjs e2e/performance-architecture.test.mjs" } }]
  non-b1:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/product-add-edit-supabase.test.mjs e2e/seo-regression.test.mjs" } }]
  non-b2:
    executor: node-bun
    steps: [restore-project, { run: { command: "node --test e2e/shopify-only-storefront.test.mjs e2e/storefront-consistency.test.mjs e2e/storefront-supabase-failover.test.mjs" } }]

workflows:
  storefront-validation:
    jobs:
      - setup:
          filters:
            branches:
              only: [/^important\/.*/]
      - tsc-catalog: { requires: [setup] }
      - tsc-inventory: { requires: [setup] }
      - tsc-receiving: { requires: [setup] }
      - tsc-other-data: { requires: [setup] }
      - lint-pages-a: { requires: [setup] }
      - lint-pages-b: { requires: [setup] }
      - lint-other-a: { requires: [setup] }
      - lint-other-b: { requires: [setup] }
      - auth-a1: { requires: [setup] }
      - auth-a2: { requires: [setup] }
      - auth-b1: { requires: [setup] }
      - auth-b2: { requires: [setup] }
      - cat-a1: { requires: [setup] }
      - cat-a2: { requires: [setup] }
      - cat-b1: { requires: [setup] }
      - cat-b2: { requires: [setup] }
      - non-a1: { requires: [setup] }
      - non-a2: { requires: [setup] }
      - non-b1: { requires: [setup] }
      - non-b2: { requires: [setup] }
