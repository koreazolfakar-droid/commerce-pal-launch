      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Unit rest group A
          command: node --test e2e/catalog-management-responsive.test.mjs e2e/catalog.test.mjs e2e/category-storefront-sync.test.mjs e2e/ci-config.test.mjs e2e/cms-refresh.test.mjs e2e/create-order-rate-limit-security.test.mjs e2e/dashboard-auth0-security.test.mjs e2e/dashboard-brands-mobile-actions.test.mjs e2e/dashboard-category-image-pipeline.test.mjs e2e/dashboard-collections-supabase.test.mjs e2e/dashboard-content-cms-step4.test.mjs e2e/dashboard-csp-session-ci.test.mjs e2e/dashboard-customers-supabase.test.mjs e2e/dashboard-hero-composite-row-regression.test.mjs e2e/dashboard-hero-image-pipeline.test.mjs e2e/dashboard-hero-supabase.test.mjs e2e/dashboard-home-supabase.test.mjs e2e/dashboard-homepage-cms.test.mjs e2e/dashboard-image-compression-controls.test.mjs e2e/dashboard-inventory-rpc-security.test.mjs e2e/dashboard-live-workspace.test.mjs e2e/dashboard-login-route.test.mjs e2e/dashboard-login-screen-capture.test.mjs e2e/dashboard-login-ui.test.mjs e2e/dashboard-orders-supabase.test.mjs e2e/dashboard-passkey-client.test.mjs

