version: 2.1
executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
jobs:
  capture-lint:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Capture lint failure
          command: |
            set +e
            bun run lint > /tmp/lint.log 2>&1
            code=$?
            cat /tmp/lint.log
            if [ "$code" -ne 0 ]; then
              curl -fsS -X POST \
                -H "x-ci-run-key: ${CIRCLE_SHA1}" \
                -H 'x-ci-job-name: lint' \
                --data-binary @/tmp/lint.log \
                https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log || true
            fi
            exit "$code"
  capture-unit:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Capture unit failure
          command: |
            set +e
            bun run test:unit > /tmp/unit.log 2>&1
            code=$?
            cat /tmp/unit.log
            if [ "$code" -ne 0 ]; then
              curl -fsS -X POST \
                -H "x-ci-run-key: ${CIRCLE_SHA1}" \
                -H 'x-ci-job-name: unit' \
                --data-binary @/tmp/unit.log \
                https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log || true
            fi
            exit "$code"
  capture-ssr:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Capture SSR failure
          command: |
            set +e
            bun run test:ssr > /tmp/ssr.log 2>&1
            code=$?
            cat /tmp/ssr.log
            if [ "$code" -ne 0 ]; then
              curl -fsS -X POST \
                -H "x-ci-run-key: ${CIRCLE_SHA1}" \
                -H 'x-ci-job-name: ssr' \
                --data-binary @/tmp/ssr.log \
                https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log || true
            fi
            exit "$code"
workflows:
  capture:
    jobs:
      - capture-lint
      - capture-unit
      - capture-ssr
