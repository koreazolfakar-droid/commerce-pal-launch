    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Catalog and auth unit tests
          command: |
            shopt -s nullglob
            files=(e2e/customer-auth-ui.test.mjs e2e/category-*.test.mjs e2e/product-*.test.mjs e2e/seo-regression.test.mjs)
