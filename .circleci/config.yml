version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

jobs:
  security-source:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: High-confidence source and secret scan
          command: node scripts/security-gate.mjs

  security-dependencies:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: High and critical dependency audit
          command: |
            source "$BASH_ENV"
            bun audit --audit-level=high

  storefront-ci:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-

      - install-bun

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

      - run:
          name: Cart targeted lint
          command: |
            set +e
            bun x eslint src/routes/cart.tsx src/components/CheckoutDetailsForm.tsx e2e/cart-delivery-dashboard.test.mjs e2e/cart-delivery-security.test.mjs e2e/cart-ux-polish.test.mjs e2e/storefront-orders-secure.test.mjs > /tmp/cart-lint.log 2>&1
            status=$?
            cat /tmp/cart-lint.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-target-lint-20260921" \
              -H "x-ci-job-name: lint" \
              --data-binary @/tmp/cart-lint.log || true
            exit $status

      - run:
          name: Cart targeted tests
          command: |
            set +e
            node --test e2e/cart-delivery-dashboard.test.mjs e2e/cart-delivery-security.test.mjs e2e/cart-ux-polish.test.mjs e2e/storefront-orders-secure.test.mjs > /tmp/cart-tests.log 2>&1
            status=$?
            cat /tmp/cart-tests.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-target-tests-20260921" \
              -H "x-ci-job-name: unit-tests" \
              --data-binary @/tmp/cart-tests.log || true
            exit $status

      - run:
          name: TypeScript
          command: |
            set +e
            bun run typecheck > /tmp/ci-step.log 2>&1
            status=$?
            cat /tmp/ci-step.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-typecheck-20260921" \
              -H "x-ci-job-name: lint" \
              --data-binary @/tmp/ci-step.log || true
            exit $status

      - run:
          name: ESLint
          command: |
            set +e
            bun run lint > /tmp/ci-step.log 2>&1
            status=$?
            cat /tmp/ci-step.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-eslint-20260921" \
              -H "x-ci-job-name: lint" \
              --data-binary @/tmp/ci-step.log || true
            exit $status

      - run:
          name: Dashboard security regression tests
          command: |
            set +e
            node --test e2e/dashboard-*.test.mjs > /tmp/ci-step.log 2>&1
            status=$?
            cat /tmp/ci-step.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-dashboard-20260921" \
              -H "x-ci-job-name: dashboard-tests" \
              --data-binary @/tmp/ci-step.log || true
            exit $status

      - run:
          name: Unit and architecture tests
          command: |
            set +e
            bun run test:unit > /tmp/ci-step.log 2>&1
            status=$?
            cat /tmp/ci-step.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-unit-20260921" \
              -H "x-ci-job-name: unit-tests" \
              --data-binary @/tmp/ci-step.log || true
            exit $status

      - run:
          name: Production build
          command: |
            set +e
            bun run build > /tmp/ci-step.log 2>&1
            status=$?
            cat /tmp/ci-step.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-build-20260921" \
              -H "x-ci-job-name: unit-tests" \
              --data-binary @/tmp/ci-step.log || true
            exit $status

      - run:
          name: SSR smoke test
          command: |
            set +e
            bun run test:ssr > /tmp/ci-step.log 2>&1
            status=$?
            cat /tmp/ci-step.log
            curl -fsS -X POST "https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log" \
              -H "x-ci-run-key: cart-polish-ssr-20260921" \
              -H "x-ci-job-name: ssr" \
              --data-binary @/tmp/ci-step.log || true
            exit $status

workflows:
  security-and-storefront-validation:
    jobs:
      - security-source
      - security-dependencies
      - storefront-ci:
          filters:
            branches:
              only:
                - /^important\/.*/
