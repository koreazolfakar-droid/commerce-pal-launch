version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  prepare:
    steps:
      - checkout
      - install-bun
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  dashboard-auth-a:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Dashboard auth shell tests
          command: |
            node --test               e2e/dashboard-auth0-security.test.mjs               e2e/dashboard-csp-session-ci.test.mjs               e2e/dashboard-login-route.test.mjs               e2e/dashboard-login-screen-capture.test.mjs

  dashboard-auth-b:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Dashboard login and passkey tests
          command: |
            node --test               e2e/dashboard-login-ui.test.mjs               e2e/dashboard-passkey-client.test.mjs               e2e/dashboard-passkey-second-factor.test.mjs               e2e/dashboard-passkey-step-up.test.mjs

  dashboard-auth-c:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Dashboard password and session security tests
          command: |
            node --test               e2e/dashboard-password-breach-screening.test.mjs               e2e/dashboard-security-hardening.test.mjs               e2e/dashboard-session-security.test.mjs               e2e/dashboard-totp-mfa.test.mjs

  core-a:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Architecture and cart tests
          command: |
            node --test               e2e/architecture.test.mjs               e2e/cart-delivery-dashboard.test.mjs               e2e/cart-delivery-security.test.mjs               e2e/cart-responsive-precision.test.mjs               e2e/cart-ux-polish.test.mjs

  core-b:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Catalog category and CI tests
          command: |
            node --test               e2e/catalog-management-responsive.test.mjs               e2e/catalog.test.mjs               e2e/category-cleanup-followup.test.mjs               e2e/category-page-premium.test.mjs               e2e/category-storefront-sync.test.mjs               e2e/category-taxonomy-cleanup.test.mjs               e2e/ci-config.test.mjs

  core-c:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: CMS auth and hero tests
          command: |
            node --test               e2e/cms-refresh.test.mjs               e2e/create-order-rate-limit-security.test.mjs               e2e/customer-auth-ui.test.mjs               e2e/hero-design.test.mjs               e2e/hero-scene.test.mjs

workflows:
  isolate-current-test-failures-stage-2:
    jobs:
      - dashboard-auth-a
      - dashboard-auth-b
      - dashboard-auth-c
      - core-a
      - core-b
      - core-c
