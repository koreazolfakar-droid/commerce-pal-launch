version: 2.1
executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
jobs:
  dashboard-tests:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: Dashboard tests, command: "node --test e2e/dashboard-*.test.mjs" }
  unit-tests:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: Unit tests, command: "bun run test:unit" }
  ssr:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: SSR, command: "bun run test:ssr" }
workflows:
  diagnose:
    jobs:
      - dashboard-tests
      - unit-tests
      - ssr
