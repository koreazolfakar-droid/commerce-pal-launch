            node --test               e2e/dashboard-inventory-rpc-security.test.mjs               e2e/dashboard-orders-supabase.test.mjs               e2e/dashboard-procurement-schema-step2.test.mjs               e2e/dashboard-product-image-metadata.test.mjs               e2e/dashboard-product-management-step5.test.mjs               e2e/dashboard-receiving-rules.test.mjs               e2e/dashboard-receiving-workflow.test.mjs               e2e/dashboard-sales-supabase.test.mjs

