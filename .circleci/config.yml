version: 2.1
executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  restore-project:
    steps:
      - checkout
      - install-bun
      - attach_workspace:
          at: ~/project
  tsc-range:
    parameters:
      file:
        type: string
      min:
        type: integer
      max:
        type: integer
    steps:
      - run:
          name: Scoped TypeScript line diagnostic
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            python3 - <<'PY'
            import re, sys
            file = "<< parameters.file >>"
            lo = << parameters.min >>
            hi = << parameters.max >>
            text = open("/tmp/tsc.log", encoding="utf-8").read().splitlines()
            found = False
            for line in text:
                if file not in line:
                    continue
                m = re.search(r"\((\d+),(\d+)\)", line)
                if m and lo <= int(m.group(1)) <= hi:
                    found = True
                    break
            sys.exit(1 if found else 0)
            PY
jobs:
  setup:
    executor: node-bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v2-{{ checksum "bun.lock" }}
            - bun-deps-v2-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v2-{{ checksum "bun.lock" }}
          paths: [~/.bun/install/cache]
      - persist_to_workspace:
          root: ~/project
          paths: [node_modules]

  tsc-catalog-pre:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/catalog.ts", min: 1, max: 748 } }]
  tsc-catalog-list:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/catalog.ts", min: 749, max: 825 } }]
  tsc-catalog-search:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/catalog.ts", min: 826, max: 867 } }]
  tsc-catalog-get:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/catalog.ts", min: 868, max: 957 } }]
  tsc-catalog-rest:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/catalog.ts", min: 958, max: 2000 } }]

  tsc-receiving-workspace:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/receiving.ts", min: 1, max: 584 } }]
  tsc-receiving-detail:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/receiving.ts", min: 585, max: 847 } }]
  tsc-receiving-rest:
    executor: node-bun
    steps: [restore-project, { tsc-range: { file: "src/dashboard/data/receiving.ts", min: 848, max: 2000 } }]

  tsc-other-data-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            set -e
            grep -E 'src/dashboard/data/(brands|categories|collections|customers|hero)\.ts' /tmp/tsc.log >/dev/null && exit 1 || exit 0
  tsc-other-data-b:
    executor: node-bun
    steps:
