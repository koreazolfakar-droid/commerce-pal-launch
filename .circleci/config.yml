version: 2.1

executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  tsc-components:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: TypeScript components, command: "bunx tsc -p tsconfig.diag-components.json --noEmit" }
  tsc-dashboard:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: TypeScript dashboard, command: "bunx tsc -p tsconfig.diag-dashboard.json --noEmit" }
  tsc-lib:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: TypeScript lib, command: "bunx tsc -p tsconfig.diag-lib.json --noEmit" }
  tsc-routes:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Generate routes and check routes
          command: |
            bun scripts/generate-routes.mjs
            bunx tsc -p tsconfig.diag-routes.json --noEmit
  tsc-integrations:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: TypeScript integrations, command: "bunx tsc -p tsconfig.diag-integrations.json --noEmit" }
  tsc-state:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: TypeScript stores and hooks, command: "bunx tsc -p tsconfig.diag-state.json --noEmit" }
  tsc-root:
    executor: node-bun
    steps:
      - bootstrap
      - run: { name: TypeScript root and test config, command: "bunx tsc -p tsconfig.diag-root.json --noEmit" }

workflows:
  diagnose-typescript-groups:
    jobs:
      - tsc-components
      - tsc-dashboard
      - tsc-lib
      - tsc-routes
      - tsc-integrations
      - tsc-state
      - tsc-root
