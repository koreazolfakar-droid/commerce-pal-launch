version: 2.1
jobs:

  diag-dash-auth:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: diag-dash-auth
          command: node --test e2e/dashboard-{auth0-security,csp-session-ci,login-route,login-screen-capture,login-ui,passkey-client,passkey-second-factor,passkey-step-up,password-breach-screening,security-hardening,session-security,totp-mfa}.test.mjs


