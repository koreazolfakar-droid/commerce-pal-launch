      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Remaining unit tests
          command: |
            shopt -s nullglob
            files=()
            for file in e2e/*.test.mjs; do
              case "$file" in
                e2e/dashboard-*|e2e/cart-*|e2e/storefront-*|e2e/architecture.test.mjs|e2e/performance-architecture.test.mjs|e2e/customer-auth-ui.test.mjs|e2e/category-*|e2e/product-*|e2e/seo-regression.test.mjs|e2e/visual-system-regression.test.mjs)
                  ;;
                *)
                  files+=("$file")
                  ;;
              esac
            done
            node --test "${files[@]}"

