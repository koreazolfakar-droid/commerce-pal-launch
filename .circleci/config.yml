      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Storefront integration and regression tests
          command: |
            node --test               e2e/hybrid-storefront.test.mjs               e2e/inventory-supabase.test.mjs               e2e/performance-architecture.test.mjs               e2e/product-add-edit-supabase.test.mjs               e2e/product-rail-carousel.test.mjs               e2e/security-pipeline-config.test.mjs               e2e/seo-regression.test.mjs               e2e/shopify-only-storefront.test.mjs               e2e/storefront-consistency.test.mjs               e2e/storefront-dark-theme.test.mjs               e2e/storefront-orders-secure.test.mjs               e2e/storefront-supabase-failover.test.mjs

