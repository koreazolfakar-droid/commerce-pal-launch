      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
          name: Performance architecture test
          command: node --test e2e/performance-architecture.test.mjs

  visual-unit-customer-auth:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - install-project
      - run:
