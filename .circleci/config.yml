version: 2.1

jobs:
  capture-typecheck:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Capture TypeScript failure
          command: |
            set +e
            bun run typecheck > /tmp/typecheck.log 2>&1
            code=$?
            cat /tmp/typecheck.log
            if [ "$code" -ne 0 ]; then
              curl -fsS -X POST \
                -H 'x-ci-debug-token: ci-debug-20260920-5f4d7b8e-c18a-4e20-a31f-9136b3a4c2d1' \
                -H "x-ci-run-key: ${CIRCLE_SHA1}" \
                -H 'x-ci-job-name: typecheck' \
                --data-binary @/tmp/typecheck.log \
                https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log || true
            fi
            exit "$code"

workflows:
  capture:
    jobs:
      - capture-typecheck
