version: 2.1
jobs:

  diag-search-exact:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: diag-search-exact
          command: node --test --test-name-pattern 'search ranking strongly prefers' e2e/catalog.test.mjs


  diag-search-sku:
