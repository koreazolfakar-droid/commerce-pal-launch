version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

jobs:
  security-source:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: High-confidence source and secret scan
          command: node scripts/security-gate.mjs

  security-dependencies:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: High and critical dependency audit
          command: |
            source "$BASH_ENV"
            bun audit --audit-level=high

  storefront-ci:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-

      - install-bun

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

      - run:
          name: TypeScript
          command: bun run typecheck

      - run:
          name: ESLint
          command: bun run lint

      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

      - run:
          name: Unit and architecture tests
          command: bun run test:unit

      - run:
          name: Production build
          command: bun run build

      - run:
          name: SSR smoke test
          command: bun run test:ssr


  diag-typecheck:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript
          command: bun run typecheck

  diag-lint:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: ESLint
          command: bun run lint

  diag-unit:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Unit and architecture tests
          command: bun run test:unit

  diag-build:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Production build
          command: bun run build

  diag-ssr:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: SSR smoke test
          command: bun run test:ssr


  diag-test-visual:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Visual system regression
          command: node --test e2e/visual-system-regression.test.mjs

  diag-test-product-density:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Product density regression
          command: node --test e2e/product-density-view.test.mjs

  diag-test-smart-image:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Smart image regression
          command: node --test e2e/dashboard-smart-image-editor.test.mjs

  diag-test-dark:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Dark theme regression
          command: node --test e2e/storefront-dark-theme.test.mjs

  diag-test-consistency:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Storefront consistency regression
          command: node --test e2e/storefront-consistency.test.mjs

  diag-test-performance:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Performance architecture regression
          command: node --test e2e/performance-architecture.test.mjs

  diag-test-category:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Category storefront sync regression
          command: node --test e2e/category-storefront-sync.test.mjs

  diag-test-homepage-cms:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Homepage CMS regression
          command: node --test e2e/dashboard-homepage-cms.test.mjs


  ui-browser-deps:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - install-bun
      - run:
          name: Install browser-test dependencies
          command: bun install --frozen-lockfile
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  ui-browser:
    parameters:
      engine:
        type: string
        default: chromium
      suite:
        type: string
        default: all
      route_group:
        type: string
        default: all
    docker:
      - image: cimg/node:lts
    resource_class: medium
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
      UI_ENGINE: << parameters.engine >>
      UI_SUITE: << parameters.suite >>
      UI_ROUTE_GROUP: << parameters.route_group >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install browser runtime
          command: ./node_modules/.bin/playwright install --with-deps << parameters.engine >>
      - run:
          name: Responsive multi-engine UI checks
          command: |
            ./node_modules/.bin/vite dev --host 0.0.0.0 --port 4173 > /tmp/ui-polish-vite.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            READY=0
            for _ in {1..60}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              cat /tmp/ui-polish-vite.log
              exit 1
            fi
            E2E_BASE_URL=http://127.0.0.1:4173 node e2e/ui-polish-responsive-check.mjs


  ui-server-smoke:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Start UI server and verify homepage
          command: |
            bun run dev:e2e --host 0.0.0.0 --port 4173 > /tmp/ui-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            READY=0
            for _ in {1..60}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /tmp/ui-home.html; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              cat /tmp/ui-server.log
              exit 1
            fi
            test -s /tmp/ui-home.html


  ui-playwright-image-smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    resource_class: small
    working_directory: ~/project
    steps:
      - run:
          name: Verify Playwright image runtime
          command: |
            node --version
            test -d /ms-playwright

workflows:
  security-and-storefront-validation:
    jobs:
      - security-source
      - security-dependencies
      - diag-typecheck
      - diag-lint
      - diag-unit
      - diag-build
      - diag-ssr
      - diag-test-visual
      - diag-test-product-density
      - diag-test-smart-image
      - diag-test-dark
      - diag-test-consistency
      - diag-test-performance
      - diag-test-category
      - diag-test-homepage-cms
      - ui-browser-deps:
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-overflow-mobile-en
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-no-hero-container
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en-no-hero-container
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-contain-hero
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en-contain-hero
          filters:
            branches:
              only:
                - /^ui\/.*/
      - ui-browser:
          requires:
            - ui-browser-deps
          name: ui-browser-webkit-hide-hero-scene
          engine: webkit
          suite: mode
          route_group: overflow-mobile-en-hide-hero-scene
          filters:
            branches:
              only:
                - /^ui\/.*/
