version: 2.1

executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  restore-analysis:
    steps:
      - checkout
      - install-bun
      - attach_workspace:
          at: ~/project

jobs:
  analyze:
    executor: node-bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v2-{{ checksum "bun.lock" }}
            - bun-deps-v2-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Generate routes
          command: bun run routes:generate
      - run:
          name: Capture TypeScript diagnostics
          command: |
            ./node_modules/.bin/tsc --noEmit --pretty false > tsc.log 2>&1 || true
      - persist_to_workspace:
          root: ~/project
          paths:
            - node_modules
            - tsc.log

  tsc-catalog-bootstrap:
    executor: node-bun
    steps:
      - restore-analysis
      - run:
          name: catalog-bootstrap
          command: python3 scripts/ci-match-tsc.py "src/dashboard/data/catalog.ts" 1 210

