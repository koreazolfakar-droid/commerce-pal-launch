version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

jobs:
  security-source:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: High-confidence source and secret scan
          command: node scripts/security-gate.mjs

  security-dependencies:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: High and critical dependency audit
          command: |
            source "$BASH_ENV"
            bun audit --audit-level=high

  storefront-ci:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-

      - install-bun

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache

      - run:
          name: TypeScript
          command: bun run typecheck

      - run:
          name: ESLint
          command: bun run lint

      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

      - run:
          name: Unit and architecture tests
          command: bun run test:unit

      - run:
          name: Production build
          command: bun run build

      - run:
          name: SSR smoke test
          command: bun run test:ssr


  perf-typecheck:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: TypeScript only
          command: bun run typecheck

  perf-lint:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: ESLint only
          command: bun run lint

  perf-unit:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Unit and architecture tests only
          command: bun run test:unit

  perf-build-ssr:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Production build
          command: bun run build
      - run:
          name: SSR smoke test
          command: bun run test:ssr


  perf-test-architecture:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Architecture test only
          command: node --test e2e/architecture.test.mjs

  perf-test-performance-architecture:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Performance architecture test only
          command: node --test e2e/performance-architecture.test.mjs


  perf-arch-group-a:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
    steps:
      - checkout
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Architecture group A
          command: node --test --test-name-pattern="store identity|storefront commerce|homepage uses bounded|global navigation" e2e/architecture.test.mjs

  perf-arch-group-b:
