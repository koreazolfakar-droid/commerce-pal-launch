version: 2.1

executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
  restore-project:
    steps:
      - checkout
      - install-bun
      - attach_workspace:
          at: ~/project
  typecheck-scope:
    parameters:
      pattern:
        type: string
    steps:
      - run:
          name: TypeScript scoped diagnostics
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if grep -E '<< parameters.pattern >>' /tmp/tsc.log >/dev/null; then exit 1; fi
            exit 0

jobs:
  setup:
    executor: node-bun
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v2-{{ checksum "bun.lock" }}
            - bun-deps-v2-
      - install-bun
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v2-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - node_modules

  typecheck-dashboard-data:
    executor: node-bun
    steps:
      - restore-project
      - typecheck-scope:
          pattern: 'src/dashboard/data/'

  typecheck-dashboard-pages:
    executor: node-bun
    steps:
      - restore-project
      - typecheck-scope:
          pattern: 'src/dashboard/pages/'

  typecheck-dashboard-components:
    executor: node-bun
    steps:
      - restore-project
      - typecheck-scope:
          pattern: 'src/dashboard/components/'

  typecheck-dashboard-other:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: TypeScript remaining dashboard diagnostics
          command: |
            bun run routes:generate
            set +e
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if grep -E 'src/dashboard/' /tmp/tsc.log | grep -Ev 'src/dashboard/(data|pages|components)/' >/dev/null; then exit 1; fi
            exit 0

  lint-dashboard-data:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: ESLint dashboard data
          command: ./node_modules/.bin/eslint src/dashboard/data --fix-dry-run

  lint-dashboard-pages:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: ESLint dashboard pages
          command: ./node_modules/.bin/eslint src/dashboard/pages --fix-dry-run

  lint-dashboard-components:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: ESLint dashboard components
          command: ./node_modules/.bin/eslint src/dashboard/components --fix-dry-run

  lint-dashboard-other:
    executor: node-bun
    steps:
      - restore-project
      - run:
          name: ESLint remaining dashboard
          command: ./node_modules/.bin/eslint src/dashboard/App.tsx src/dashboard/AppMount.tsx src/dashboard/config src/dashboard/contexts src/dashboard/hooks src/dashboard/lib src/dashboard/security src/dashboard/i18n.ts --fix-dry-run

  test-shell-live-workspace:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-live-workspace.test.mjs

  test-shell-source-guard:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-supabase-source-guard.test.mjs

  test-shell-truthful:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-truthful-shell.test.mjs

  test-auth-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-auth0-security.test.mjs e2e/dashboard-csp-session-ci.test.mjs e2e/dashboard-login-route.test.mjs e2e/dashboard-login-screen-capture.test.mjs

  test-auth-b:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-login-ui.test.mjs e2e/dashboard-password-breach-screening.test.mjs e2e/dashboard-security-hardening.test.mjs e2e/dashboard-session-security.test.mjs e2e/dashboard-totp-mfa.test.mjs

  test-catalog-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-category-image-pipeline.test.mjs e2e/dashboard-collections-supabase.test.mjs e2e/dashboard-content-cms-step4.test.mjs e2e/dashboard-hero-image-pipeline.test.mjs e2e/dashboard-hero-supabase.test.mjs

  test-catalog-b:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/dashboard-home-supabase.test.mjs e2e/dashboard-homepage-cms.test.mjs e2e/dashboard-product-image-metadata.test.mjs e2e/dashboard-product-management-step5.test.mjs e2e/dashboard-settings-supabase.test.mjs

  test-nondashboard-a:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/architecture.test.mjs e2e/catalog.test.mjs e2e/cms-refresh.test.mjs e2e/hybrid-storefront.test.mjs e2e/inventory-supabase.test.mjs e2e/performance-architecture.test.mjs

  test-nondashboard-b:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/product-add-edit-supabase.test.mjs e2e/seo-regression.test.mjs e2e/shopify-only-storefront.test.mjs e2e/storefront-consistency.test.mjs e2e/storefront-supabase-failover.test.mjs

  test-ci-config:
    executor: node-bun
    steps:
      - restore-project
      - run:
          command: node --test e2e/ci-config.test.mjs

workflows:
  storefront-validation:
    jobs:
      - setup:
          filters:
            branches:
              only:
                - /^important\/.*/
      - typecheck-dashboard-data: { requires: [setup] }
      - typecheck-dashboard-pages: { requires: [setup] }
      - typecheck-dashboard-components: { requires: [setup] }
      - typecheck-dashboard-other: { requires: [setup] }
      - lint-dashboard-data: { requires: [setup] }
      - lint-dashboard-pages: { requires: [setup] }
      - lint-dashboard-components: { requires: [setup] }
      - lint-dashboard-other: { requires: [setup] }
      - test-shell-live-workspace: { requires: [setup] }
      - test-shell-source-guard: { requires: [setup] }
      - test-shell-truthful: { requires: [setup] }
      - test-auth-a: { requires: [setup] }
      - test-auth-b: { requires: [setup] }
      - test-catalog-a: { requires: [setup] }
      - test-catalog-b: { requires: [setup] }
      - test-nondashboard-a: { requires: [setup] }
      - test-nondashboard-b: { requires: [setup] }
      - test-ci-config: { requires: [setup] }
