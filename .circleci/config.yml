version: 2.1

executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  install-smoke:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Verify toolchain
          command: |
            bun --version
            node --version
            test -f bun.lock

  routes-generate:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Generate routes
          command: bun scripts/generate-routes.mjs

  typescript-direct:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: TypeScript direct
          command: bunx tsc --noEmit

workflows:
  diagnose:
    jobs:
      - install-smoke:
          filters:
            branches:
              only:
                - /^important\/diag-ci-stages-.*$/
      - routes-generate:
          filters:
            branches:
              only:
                - /^important\/diag-ci-stages-.*$/
      - typescript-direct:
          filters:
            branches:
              only:
                - /^important\/diag-ci-stages-.*$/
