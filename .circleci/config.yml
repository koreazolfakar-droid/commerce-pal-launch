version: 2.1
executors:
  node-bun:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    environment:
      BUN_INSTALL: /home/circleci/.bun
commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
jobs:
  dashboard-tests:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Capture dashboard tests
          command: |
            set +e
            node --test e2e/dashboard-*.test.mjs > /tmp/job.log 2>&1
            code=$?
            cat /tmp/job.log
            if [ "$code" -ne 0 ]; then
              curl -fsS -X POST -H "x-ci-run-key: ${CIRCLE_SHA1}" -H 'x-ci-job-name: dashboard-tests' --data-binary @/tmp/job.log https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log || true
            fi
            exit "$code"
  unit-tests:
    executor: node-bun
    steps:
      - bootstrap
      - run:
          name: Capture unit tests
          command: |
            set +e
            bun run test:unit > /tmp/job.log 2>&1
            code=$?
            cat /tmp/job.log
            if [ "$code" -ne 0 ]; then
              curl -fsS -X POST -H "x-ci-run-key: ${CIRCLE_SHA1}" -H 'x-ci-job-name: unit-tests' --data-binary @/tmp/job.log https://rtwyankpxtffqqrasyzw.supabase.co/functions/v1/ci-debug-log || true
            fi
            exit "$code"
workflows:
  capture:
    jobs:
      - dashboard-tests
      - unit-tests
