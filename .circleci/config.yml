version: 2.1

commands:
  install-bun:
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

  prepare:
    steps:
      - checkout
      - install-bun
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
            - bun-deps-v1-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

jobs:
  health-typecheck:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: TypeScript
          command: bun run typecheck

  health-lint:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: ESLint
          command: bun run lint

  health-dashboard-tests:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Dashboard security regression tests
          command: node --test e2e/dashboard-*.test.mjs

  health-unit-tests:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Unit and architecture tests
          command: bun run test:unit

  health-build:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Production build
          command: bun run build

  health-ssr:
    docker:
      - image: cimg/node:lts
    resource_class: small
    working_directory: ~/project
    steps:
      - prepare
      - run:
          name: Production build
          command: bun run build
      - run:
          name: SSR smoke test
          command: bun run test:ssr

workflows:
  current-main-health-diagnostics:
    jobs:
      - health-typecheck
      - health-lint
      - health-dashboard-tests
      - health-unit-tests
      - health-build
      - health-ssr
