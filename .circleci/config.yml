      - run:
          name: Unit rest group B
          command: node --test e2e/dashboard-passkey-second-factor.test.mjs e2e/dashboard-passkey-step-up.test.mjs e2e/dashboard-password-breach-screening.test.mjs e2e/dashboard-procurement-schema-step2.test.mjs e2e/dashboard-product-image-metadata.test.mjs e2e/dashboard-product-management-step5.test.mjs e2e/dashboard-receiving-rules.test.mjs e2e/dashboard-receiving-workflow.test.mjs e2e/dashboard-security-hardening.test.mjs e2e/dashboard-session-security.test.mjs e2e/dashboard-settings-supabase.test.mjs e2e/dashboard-supabase-source-guard.test.mjs e2e/dashboard-totp-mfa.test.mjs e2e/dashboard-truthful-shell.test.mjs e2e/hero-design.test.mjs e2e/hero-scene.test.mjs e2e/hybrid-storefront.test.mjs e2e/inventory-supabase.test.mjs e2e/product-add-edit-supabase.test.mjs e2e/security-pipeline-config.test.mjs e2e/seo-regression.test.mjs e2e/shopify-only-storefront.test.mjs e2e/storefront-consistency.test.mjs e2e/storefront-dark-theme.test.mjs e2e/storefront-supabase-failover.test.mjs

