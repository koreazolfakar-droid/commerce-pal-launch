plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = releaseKeystorePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

android {
    namespace "store.spacecallapp.app"
    compileSdk 36

    defaultConfig {
        applicationId "store.spacecallapp.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        checkDependencies true
        warningsAsErrors false
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.3"
    implementation "com.google.androidbrowserhelper:locationdelegation:1.1.2"
    testImplementation "junit:junit:4.13.2"
}

gradle.taskGraph.whenReady { graph ->
    def createsReleaseArtifact = graph.allTasks.any {
        it.name == "assembleRelease" || it.name == "bundleRelease"
    }

    if (createsReleaseArtifact && !releaseSigningConfigured) {
        throw new GradleException(
            "Release APK/AAB generation is blocked until the persistent Space Call signing key is configured."
        )
    }
}
