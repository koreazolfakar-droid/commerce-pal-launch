project_id = "rtwyankpxtffqqrasyzw"

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Space Call Dashboard"
rp_id = "spacecallapp.store"
rp_origins = ["https://spacecallapp.store", "https://www.spacecallapp.store"]

[functions.create-order]
# Guest checkout is intentional. The function performs its own origin checks,
# payload validation, rate limiting, idempotency, and privileged RPC isolation.
verify_jwt = false

[functions.customer-orders]
# Order history is private and must always require an authenticated customer JWT.
verify_jwt = true

[functions.ci-debug-log]
verify_jwt = true

[functions.space-call-cms-admin]
verify_jwt = true
