name: Float AI Advisor Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/float-ai-advisor-once.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make AI advisor floating on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/SmartPhoneAdvisor.tsx")
          text = path.read_text()

          replacements = {
              '''    const previousOverflow = document.body.style.overflow;\n    if (window.innerWidth < 1024) document.body.style.overflow = "hidden";\n    window.addEventListener("keydown", onKeyDown);''': '''    window.addEventListener("keydown", onKeyDown);''',
              '''      window.removeEventListener("keydown", onKeyDown);\n      document.body.style.overflow = previousOverflow;''': '''      window.removeEventListener("keydown", onKeyDown);''',
              '''            className="fixed inset-0 z-[49] hidden bg-black/15 backdrop-blur-[2px] lg:block"''': '''            className="fixed inset-0 z-[49] hidden bg-black/15 backdrop-blur-[2px] lg:block"''',
              '''className="fixed inset-0 z-50 flex flex-col overflow-hidden bg-card shadow-2xl lg:inset-auto lg:bottom-6 lg:right-6 lg:h-[calc(100dvh-3rem)] lg:max-h-[760px] lg:w-[480px] lg:rounded-[var(--sc-card-radius)] lg:border lg:border-border/80"''': '''className="fixed bottom-[calc(var(--mobile-nav-height)+0.75rem)] left-3 right-3 z-50 flex h-[min(68dvh,620px)] max-h-[620px] flex-col overflow-hidden rounded-[var(--sc-card-radius)] border border-border/80 bg-card shadow-2xl sm:left-auto sm:right-5 sm:w-[420px] lg:bottom-6 lg:right-6 lg:h-[calc(100dvh-3rem)] lg:max-h-[760px] lg:w-[480px]"''',
              '''className="relative border-b border-border/70 bg-card/95 px-4 pb-3 pt-[max(0.75rem,env(safe-area-inset-top))] backdrop-blur-xl sm:px-5 lg:pt-4"''': '''className="relative border-b border-border/70 bg-card/95 px-4 pb-3 pt-3 backdrop-blur-xl sm:px-5 lg:pt-4"''',
              '''className="border-t border-border/70 bg-card/95 px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-3 backdrop-blur-xl sm:px-4 lg:pb-4"''': '''className="border-t border-border/70 bg-card/95 px-3 pb-3 pt-3 backdrop-blur-xl sm:px-4 lg:pb-4"''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected pattern not found:\n{old}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit floating advisor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SmartPhoneAdvisor.tsx
          git commit -m "Make AI advisor floating on mobile"
          git push
