name: Cart Polish Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Cart regression tests
        run: |
          node --test e2e/cart-*.test.mjs
          node --test e2e/storefront-orders-secure.test.mjs

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
