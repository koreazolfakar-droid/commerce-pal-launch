name: Format CI hardening branch

on:
  push:
    branches:
      - chore/ci-e2e-hardening-2026-09-17

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ci-e2e-hardening-2026-09-17

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply safe lint fixes
        run: bun run lint:fix

      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply lint formatting fixes"
          git push origin HEAD:chore/ci-e2e-hardening-2026-09-17
