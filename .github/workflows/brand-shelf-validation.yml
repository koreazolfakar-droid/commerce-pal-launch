name: Brand Shelf Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/brand-shelf-validation.yml"
      - "src/components/BrandShowcaseSections.tsx"
      - "src/lib/queries.ts"
      - "e2e/architecture.test.mjs"

permissions:
  contents: read

concurrency:
  group: brand-shelf-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Targeted Prettier
        run: bunx prettier --check src/components/BrandShowcaseSections.tsx src/lib/queries.ts e2e/architecture.test.mjs

      - name: Targeted ESLint
        run: bunx eslint src/components/BrandShowcaseSections.tsx src/lib/queries.ts

      - name: Unit and architecture tests
        run: bun run test:unit

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
