name: Temporary security dependency refresh

on:
  push:
    branches:
      - fix/dashboard-customer-delivery-map-20261030
    paths:
      - .github/workflows/security-dependency-refresh-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'koreazolfakar-droid/commerce-pal-launch' && github.ref == 'refs/heads/fix/dashboard-customer-delivery-map-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Install current lock
        run: bun install --frozen-lockfile
      - name: Refresh vulnerable dependencies within existing ranges
        run: bun update seroval zod@4.6.7
      - name: Verify frozen lock and package manifest match
        run: bun install --frozen-lockfile
      - name: Verify focused regression tests
        run: node --test e2e/dashboard-order-delivery-location.test.mjs
      - name: Verify type safety
        run: bun run typecheck
      - name: Verify no high or critical vulnerabilities remain
        run: bun audit --audit-level=high
      - name: Commit secure lock and remove one-time workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/security-dependency-refresh-temp.yml
          git add bun.lock package.json .github/workflows/security-dependency-refresh-temp.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to update" >&2
            exit 1
          fi
          git commit -m "fix(deps): upgrade vulnerable Seroval and Zod packages"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/dashboard-customer-delivery-map-20261030
