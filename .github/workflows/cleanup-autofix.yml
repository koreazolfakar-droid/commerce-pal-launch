name: Cleanup Autofix

on:
  push:
    branches:
      - refactor/safe-code-cleanup-20260914

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/safe-code-cleanup-20260914
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply configured safe lint autofixes
        run: bun run lint -- --fix || true

      - name: Commit autofixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply repository lint autofixes"
          git push origin HEAD:refactor/safe-code-cleanup-20260914
