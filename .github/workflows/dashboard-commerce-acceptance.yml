name: Dashboard Commerce Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      [
        "src/dashboard/**",
        "src/integrations/supabase/**",
        "supabase/**",
        "e2e/**",
        "package.json",
        "bun.lock",
        ".github/workflows/dashboard-commerce-acceptance.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "src/dashboard/**",
        "src/integrations/supabase/**",
        "supabase/**",
        "e2e/**",
        "package.json",
        "bun.lock",
        ".github/workflows/dashboard-commerce-acceptance.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-commerce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated Auth, REST and PostgreSQL
        run: node e2e/helpers/prepare-commerce-stack.mjs
      - name: Staff, orders, payment, cancellation, purchasing and stock
        run: node e2e/dashboard-commerce-acceptance.mjs
      - name: Remove local test services and data
        if: always()
        run: node e2e/helpers/prepare-commerce-stack.mjs --stop
