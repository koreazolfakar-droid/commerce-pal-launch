name: Temporary CI Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate routes
        run: bun run routes:generate
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: ESLint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Unit and architecture tests
        id: unit
        continue-on-error: true
        run: bun run test:unit
      - name: Dashboard regression tests
        id: dashboard
        continue-on-error: true
        run: node --test e2e/dashboard-*.test.mjs
      - name: Fail if diagnostics failed
        if: always()
        run: |
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.dashboard.outcome }}" = "success"
