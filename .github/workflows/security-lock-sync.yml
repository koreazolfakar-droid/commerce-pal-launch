name: Security dependency lockfile sync (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'vendor/picomatch/**'
      - 'e2e/picomatch-redos-regression.test.mjs'
      - '.github/workflows/security-lock-sync.yml'

permissions:
  contents: write

concurrency:
  group: security-picomatch-lock-sync
  cancel-in-progress: true

jobs:
  regenerate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/dashboard-login-throttle-atomic-20261118' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Validate vendored parser without network inputs
        run: node --test e2e/picomatch-redos-regression.test.mjs
      - name: Regenerate lockfile and validate install / audit
        run: |
          bun install
          bun install --frozen-lockfile
          bun audit --audit-level=high
          node --test e2e/picomatch-redos-regression.test.mjs
      - name: Commit only regenerated lockfile if security gates passed
        run: |
          git add bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(security): lock verified local picomatch CVE backport"
            git push origin HEAD:security/dashboard-login-throttle-atomic-20261118
          fi
