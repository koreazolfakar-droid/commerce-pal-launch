name: Deep Security Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Dashboard security regression tests
        run: node --test e2e/dashboard-*.test.mjs

      - name: Unit and architecture tests
        run: bun run test:unit

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: SPACE_CALL_VISUAL_FIXTURES=1 NODE_OPTIONS="--import ./e2e/helpers/storefront-fixture-fetch.mjs" bun run test:ssr

  application-security:
    name: Application Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Source security invariants
        run: |
          node scripts/security-gate.mjs
          node scripts/android-security-gate.mjs

      - name: Dependency advisory gate
        run: bun audit --audit-level=high

  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep==1.177.0

      - name: Scan application code
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/javascript
          --config p/nodejs
          --error
          --severity ERROR
          --metrics=off
          --exclude node_modules
          --exclude dist
          --exclude .output
          --exclude .nitro
          --exclude coverage
          .

  supply-chain:
    name: Dependencies / Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-dirs: node_modules,dist,.output,.nitro,coverage

  deep-security-scan:
    name: Deep Security Scan
    if: always()
    needs:
      - quality
      - application-security
      - secrets
      - sast
      - supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce all deep checks
        env:
          QUALITY: ${{ needs.quality.result }}
          APPLICATION_SECURITY: ${{ needs.application-security.result }}
          SECRETS: ${{ needs.secrets.result }}
          SAST: ${{ needs.sast.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        run: |
          echo "quality=$QUALITY"
          echo "application_security=$APPLICATION_SECURITY"
          echo "secrets=$SECRETS"
          echo "sast=$SAST"
          echo "supply_chain=$SUPPLY_CHAIN"

          if [ "$QUALITY" != "success" ] || \
             [ "$APPLICATION_SECURITY" != "success" ] || \
             [ "$SECRETS" != "success" ] || \
             [ "$SAST" != "success" ] || \
             [ "$SUPPLY_CHAIN" != "success" ]; then
            echo "::error::Deep Security Scan blocked this run."
            exit 1
          fi

          echo "Deep Security Scan passed."
