name: Native Storefront Integration

on:
  pull_request:
    branches:
      - "staging/no-shopify-dashboard"
      - main
  push:
    branches:
      - "integration/no-shopify-dashboard-unified"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full storefront check (deterministic local provider)
        env:
          VITE_STOREFRONT_DATA_SOURCE: local
        run: bun run check

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop
          - mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Storefront browser E2E (${{ matrix.project }})
        run: bun run test:e2e -- --project=${{ matrix.project }}

  supabase-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Supabase-only storefront
        env:
          VITE_STOREFRONT_DATA_SOURCE: supabase
        run: bun run build

      - name: Supabase-only SSR smoke
        run: node e2e/ssr-native-supabase.mjs
