name: Native Storefront Integration

on:
  pull_request:
    branches:
      - "staging/no-shopify-dashboard"
      - main
  push:
    branches:
      - "integration/no-shopify-dashboard-unified"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full storefront check
        run: bun run check
