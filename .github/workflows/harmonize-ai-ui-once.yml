name: Harmonize AI UI Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harmonize-ai-ui-once.yml

permissions:
  contents: write

jobs:
  harmonize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harmonize advisor visual tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/SmartPhoneAdvisor.tsx")
          text = path.read_text()

          replacements = {
              'lg:rounded-[2rem] lg:border lg:border-border/80': 'lg:rounded-[var(--sc-card-radius)] lg:border lg:border-border/80',
              'rounded-2xl bg-primary text-primary-foreground shadow-sm': 'rounded-[var(--sc-control-radius)] bg-primary text-primary-foreground shadow-card',
              'className="h-9 w-9 rounded-xl text-muted-foreground"': 'className="h-11 w-11 rounded-[var(--sc-control-radius)] text-muted-foreground"',
              'className="h-9 w-9 rounded-xl"': 'className="h-11 w-11 rounded-[var(--sc-control-radius)]"',
              'rounded-xl border border-primary/10 bg-primary/[0.04] px-3 py-2 text-[10px]': 'rounded-[var(--sc-control-radius)] border border-primary/10 bg-primary/[0.04] px-3 py-2 text-[11px]',
              'overflow-y-auto overscroll-contain bg-gradient-to-b from-surface/35 via-background to-background px-3 py-4 sm:px-4': 'overflow-y-auto overscroll-contain bg-background px-[var(--sc-gutter-mobile)] py-4 sm:px-[var(--sc-gutter-tablet)]',
              'rounded-[1.4rem] border border-primary/10 bg-primary/[0.06] text-primary shadow-sm': 'rounded-[var(--sc-card-radius)] border border-primary/10 bg-primary/[0.06] text-primary shadow-card',
              'rounded-[1.2rem] rounded-br-md bg-primary text-primary-foreground': 'rounded-[var(--sc-card-radius)] rounded-br-md bg-primary text-primary-foreground',
              'rounded-[1.2rem] rounded-bl-md border bg-card text-foreground': 'rounded-[var(--sc-card-radius)] rounded-bl-md border bg-card text-foreground',
              'rounded-2xl border border-primary/15 bg-primary/[0.05] p-3': 'rounded-[var(--sc-card-radius)] border border-primary/15 bg-primary/[0.05] p-3',
              'overflow-hidden rounded-2xl border bg-card shadow-sm': 'overflow-hidden rounded-[var(--sc-card-radius)] border bg-card shadow-card',
              'rounded-xl border border-success/20 bg-success/5 p-2.5': 'rounded-[var(--sc-control-radius)] border border-success/20 bg-success/5 p-2.5',
              'rounded-xl border bg-surface/70 p-2.5': 'rounded-[var(--sc-control-radius)] border bg-surface/70 p-2.5',
              'rounded-2xl border bg-card p-3 shadow-sm': 'rounded-[var(--sc-card-radius)] border bg-card p-3 shadow-card',
              'rounded-xl border bg-background p-3 transition-colors': 'rounded-[var(--sc-control-radius)] border bg-background p-3 transition-colors',
              'rounded-[1.2rem] rounded-bl-md border bg-card px-3.5 py-2.5': 'rounded-[var(--sc-card-radius)] rounded-bl-md border bg-card px-3.5 py-2.5',
              'rounded-2xl border bg-card px-3.5 py-3 text-left shadow-sm': 'rounded-[var(--sc-card-radius)] border bg-card px-3.5 py-3 text-left shadow-card',
              'rounded-[1.3rem] border bg-background p-1.5 shadow-sm': 'rounded-[var(--sc-card-radius)] border bg-background p-1.5 shadow-card',
              'className="h-10 w-10 shrink-0 rounded-2xl"': 'className="h-11 w-11 shrink-0 rounded-[var(--sc-control-radius)]"',
              'text-[8px] font-medium text-muted-foreground/80': 'text-[10px] font-medium text-muted-foreground/80',
              'text-[9px] font-black uppercase tracking-[0.16em] text-primary': 'text-[10px] font-black uppercase tracking-[0.14em] text-primary',
              'text-[8px] font-black uppercase tracking-[0.12em] text-muted-foreground': 'text-[9px] font-black uppercase tracking-[0.1em] text-muted-foreground',
              'mt-1 break-words font-semibold leading-snug text-foreground': 'mt-1 break-words text-[11px] font-semibold leading-snug text-foreground',
              'text-[9px] font-black uppercase tracking-wide text-success': 'text-[10px] font-black uppercase tracking-wide text-success',
              'text-[9px] font-black uppercase tracking-wide text-muted-foreground': 'text-[10px] font-black uppercase tracking-wide text-muted-foreground',
              'mt-1.5 space-y-1 text-[10px] leading-relaxed': 'mt-1.5 space-y-1 text-[11px] leading-relaxed',
              'text-[9px] font-black uppercase tracking-[0.15em] text-muted-foreground': 'text-[10px] font-black uppercase tracking-[0.13em] text-muted-foreground',
              'truncate text-[11px] font-black text-foreground': 'truncate text-xs font-black text-foreground',
              'mt-1 line-clamp-2 text-[9px] leading-relaxed text-muted-foreground': 'mt-1 line-clamp-2 text-[10px] leading-relaxed text-muted-foreground',
              'text-[11px] font-black text-primary': 'text-xs font-black text-primary',
              'mt-1 text-[8px] font-black uppercase tracking-wide': 'mt-1 text-[9px] font-black uppercase tracking-wide',
              'px-2.5 py-1 text-[9px] font-semibold text-muted-foreground': 'px-2.5 py-1 text-[10px] font-semibold text-muted-foreground',
              'px-3 py-1.5 text-[9px] font-bold text-muted-foreground': 'px-3 py-1.5 text-[10px] font-bold text-muted-foreground',
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
              text = text.replace(old, new)

          if missing:
              print("Some optional style patterns were already different:")
              for item in missing:
                  print(" -", item)

          path.write_text(text)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format advisor
        run: bunx prettier --write src/components/SmartPhoneAdvisor.tsx

      - name: Commit consistency pass
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SmartPhoneAdvisor.tsx
          git commit -m "Harmonize AI advisor with storefront design system"
          git push
