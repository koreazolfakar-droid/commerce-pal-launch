name: Storefront CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/styles.css"
      - "src/ui-overhaul.css"
      - "src/design-consistency.css"
      - "src/dark-black.css"
      - "src/components/**"
      - "src/routes/**"
      - "src/dashboard/**"
      - "e2e/**/*.test.mjs"
      - "e2e/ui-polish-responsive-check.mjs"
      - ".github/workflows/storefront-ci.yml"

permissions:
  contents: read

concurrency:
  group: storefront-ci-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Dashboard security regression tests
        run: node --test e2e/dashboard-*.test.mjs

      - name: Unit and architecture tests
        run: bun run test:unit

      - name: Install Chromium for responsive UI checks
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Responsive UI, RTL, theme and route checks
        run: |
          bun run dev:e2e --host 0.0.0.0 --port 4173 > /tmp/ui-polish-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/ui-polish-responsive-check.mjs

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
