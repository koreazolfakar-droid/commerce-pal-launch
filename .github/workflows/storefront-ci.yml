name: Storefront CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Source security gate
        run: |
          node scripts/security-gate.mjs
          node scripts/android-security-gate.mjs

      - name: Dependency security gate
        run: bun audit --audit-level=high

      - name: Dashboard security regression tests
        run: node --test e2e/dashboard-*.test.mjs

      - name: Unit, security regression and architecture tests
        run: bun run test:unit

      - name: Install Chromium for responsive UI checks
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Responsive UI, RTL, theme and route checks
        run: |
          bun run dev:e2e --host 0.0.0.0 --port 4173 > /tmp/ui-polish-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/ui-polish-responsive-check.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/hero-responsive-check.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/bottom-nav-responsive-check.mjs

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr

  dependency_security_repair_once:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/product-create-flow-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout trusted repair branch
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply all range-compatible vulnerability fixes
        run: |
          bun audit fix --audit-level=high || true
          bun audit --audit-level=high || true
      - name: Commit resulting lockfile and package changes
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "No dependency changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json bun.lock
          git commit -m "fix(deps): apply compatible security patches to Bun lockfile"
          git push origin HEAD:refs/heads/feat/product-create-flow-20261021
