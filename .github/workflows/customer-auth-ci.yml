name: Customer Auth CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/customer-auth/**"
      - "src/components/SiteHeader.tsx"
      - "src/components/MobileTopBar.tsx"
      - "src/routes/__root.tsx"
      - "e2e/customer-auth-ui.test.mjs"
      - ".github/workflows/customer-auth-ci.yml"

permissions:
  contents: read

concurrency:
  group: customer-auth-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source security gate
        run: node scripts/security-gate.mjs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Customer auth regression tests
        run: node --test e2e/customer-auth-ui.test.mjs
      - name: Unit and architecture tests
        run: bun run test:unit

  build-ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: SSR smoke test
        run: bun run test:ssr
