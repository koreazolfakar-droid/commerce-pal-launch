name: Temporary Cloudflare staging dependency bootstrap

on:
  push:
    branches: [migration/cloudflare-workers-staging-20261030]
    paths: [".github/workflows/cloudflare-staging-deps-bootstrap.yml"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'koreazolfakar-droid/commerce-pal-launch' && github.ref == 'refs/heads/migration/cloudflare-workers-staging-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Add official Workers build dependencies
        run: bun add -d @cloudflare/vite-plugin wrangler
      - name: Verify reproducible lock
        run: bun install --frozen-lockfile
      - name: Verify migration safety
        run: node --test e2e/cloudflare-workers-migration.test.mjs
      - name: TypeScript
        run: bun run typecheck
      - name: Build Cloudflare SSR Worker
        run: bun run build:cloudflare
      - name: Security audit
        run: bun audit --audit-level=high
      - name: Commit generated lockfile and remove one-time bootstrap workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cloudflare-staging-deps-bootstrap.yml
          git add package.json bun.lock
          git diff --cached --check
          git commit -m "build(cloudflare): lock official Workers dependencies after staging build"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/migration/cloudflare-workers-staging-20261030
