name: Performance Change Validation

on:
  push:
    branches:
      - perf/defer-interactive-js-validate

permissions:
  contents: read

jobs:
  validate-performance-change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Unit and architecture tests
        run: bun run test:unit

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
