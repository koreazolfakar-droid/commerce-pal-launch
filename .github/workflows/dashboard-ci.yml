name: Dashboard CI

on:
  push:
    branches:
      - feature/spacecall-admin-dashboard
    paths:
      - "dashboard/**"
      - "src/lib/adminApi.ts"
      - "src/routes/api.admin.*.ts"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "src/lib/adminApi.ts"
      - "src/routes/api.admin.*.ts"
      - ".github/workflows/dashboard-ci.yml"

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package.json

      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build dashboard
        run: npm run build:preview

  storefront-api-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install storefront dependencies
        run: npm install --no-audit --no-fund

      - name: Build storefront and admin API routes
        run: npm run build
