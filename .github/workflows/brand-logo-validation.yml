name: Brand Logo Validation

on:
  push:
    branches:
      - fix/shopify-brand-logo-refresh

permissions:
  contents: read

concurrency:
  group: brand-logo-validation-${{ github.ref }}
  cancel-in-progress: true

# Verification pass 2: application source is intentionally unchanged.
jobs:
  validate-brand-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Unit and regression tests
        shell: bash
        run: |
          mapfile -d '' tests < <(find e2e -name '*.test.mjs' ! -name 'ci-config.test.mjs' -print0)
          node --test "${tests[@]}"

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
