name: Format AI Advisor Once

on:
  push:
    branches:
      - main
    paths:
      - src/components/SmartPhoneAdvisor.tsx
      - .github/workflows/format-ai-advisor-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format AI advisor
        run: bunx prettier --write src/components/SmartPhoneAdvisor.tsx

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SmartPhoneAdvisor.tsx
          git commit -m "Format AI advisor interface"
          git push
