name: Hero Responsive CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/HomeHero.tsx"
      - "e2e/hero-responsive.spec.ts"
      - ".github/workflows/hero-responsive-ci.yml"

permissions:
  contents: read

jobs:
  hero-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm for Playwright webServer
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run hero viewport regression tests
        run: ./node_modules/.bin/playwright test e2e/hero-responsive.spec.ts --project=mobile

      - name: Production build
        run: bun run build
