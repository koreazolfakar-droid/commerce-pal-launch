name: Hero Responsive CI

on:
  push:
    branches:
      - main
    paths:
      - "src/components/HomeHero.tsx"
      - "src/components/BottomNav.tsx"
      - "src/components/MobileTopBar.tsx"
      - "src/components/MobileMenu.tsx"
      - "src/components/SearchOverlay.tsx"
      - "src/components/StoreLayout.tsx"
      - "src/performance.css"
      - "src/home-ticker.css"
      - "src/router.tsx"
      - "e2e/hero-responsive-check.mjs"
      - "e2e/ux-performance-check.mjs"
      - "e2e/ux-visual-review.mjs"
      - ".github/workflows/hero-responsive-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/components/HomeHero.tsx"
      - "src/components/BottomNav.tsx"
      - "src/components/MobileTopBar.tsx"
      - "src/components/MobileMenu.tsx"
      - "src/components/SearchOverlay.tsx"
      - "src/components/StoreLayout.tsx"
      - "src/performance.css"
      - "src/home-ticker.css"
      - "src/router.tsx"
      - "e2e/hero-responsive-check.mjs"
      - "e2e/ux-performance-check.mjs"
      - "e2e/ux-visual-review.mjs"
      - ".github/workflows/hero-responsive-ci.yml"

permissions:
  contents: read

concurrency:
  group: hero-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run real-browser responsive and UX checks
        run: |
          bun run dev:e2e --host 0.0.0.0 --port 4173 > /tmp/hero-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/hero-responsive-check.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/ux-performance-check.mjs
          E2E_BASE_URL=http://127.0.0.1:4173 node e2e/ux-visual-review.mjs

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-visual-review
          path: artifacts/*.png
          if-no-files-found: ignore

      - name: Production build
        run: bun run build
