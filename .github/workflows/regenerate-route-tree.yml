name: Regenerate Route Tree

on:
  push:
    branches:
      - refactor/safe-code-cleanup-20260914

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/safe-code-cleanup-20260914
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate TanStack route tree through production build
        run: bun run build

      - name: Commit generated route tree when changed
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate TanStack route tree"
          git push origin HEAD:refactor/safe-code-cleanup-20260914
