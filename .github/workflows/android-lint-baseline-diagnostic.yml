name: Android Lint Baseline Diagnostic

on:
  push:
    branches:
      - fix/android-production-foundation-20260924

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[lint-baseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact branch without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME"             "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Android and Gradle toolchain
        working-directory: repo
        env:
          GRADLE_VERSION: "9.6.0"
          GRADLE_SHA256: "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
        run: |
          set -euo pipefail
          java -version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          curl --proto '=https' --tlsv1.2 -fsSL             "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"             -o /tmp/gradle.zip
          echo "$GRADLE_SHA256  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Generate diagnostic lint baseline
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          old = """    lint {
                  abortOnError true
                  checkReleaseBuilds true
                  checkDependencies false
                  warningsAsErrors false
              }"""
          new = """    lint {
                  abortOnError true
                  checkReleaseBuilds true
                  checkDependencies false
                  warningsAsErrors false
                  baseline = file("lint-baseline-diagnostic.xml")
              }"""
          if old not in s:
              raise SystemExit("lint block not found")
          p.write_text(s.replace(old, new))
          PY

          cd android
          set +e
          gradle --no-daemon --stacktrace :app:lintDebug
          STATUS=$?
          set -e
          cd ..

          git checkout -- android/app/build.gradle
          test -s android/app/lint-baseline-diagnostic.xml
          echo "Lint exit code was $STATUS; diagnostic baseline captured."

      - name: Commit diagnostic baseline for inspection
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add android/app/lint-baseline-diagnostic.xml
          git commit -m "[lint-baseline] capture Android lint issue IDs"
          git push origin "HEAD:$GITHUB_REF_NAME"
