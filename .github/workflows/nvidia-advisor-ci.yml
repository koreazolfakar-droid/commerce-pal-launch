name: Smart Bot CI

on:
  push:
    branches:
      - main
    paths:
      - src/lib/smartPhoneAdvisor.functions.ts
      - src/components/SmartPhoneAdvisor.tsx
      - e2e/nvidia-advisor.test.mjs
      - .github/workflows/nvidia-advisor-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - src/lib/smartPhoneAdvisor.functions.ts
      - src/components/SmartPhoneAdvisor.tsx
      - e2e/nvidia-advisor.test.mjs
      - .github/workflows/nvidia-advisor-ci.yml

permissions:
  contents: read

concurrency:
  group: smart-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Smart bot regression tests
        run: node --test e2e/nvidia-advisor.test.mjs

      - name: Production build
        run: bun run build
