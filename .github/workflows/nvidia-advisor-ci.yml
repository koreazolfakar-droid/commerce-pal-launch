name: NVIDIA Advisor CI

on:
  push:
    branches:
      - feature/nvidia-smart-advisor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit and regression tests
        run: bun run test:unit

      - name: Production build
        run: bun run build
