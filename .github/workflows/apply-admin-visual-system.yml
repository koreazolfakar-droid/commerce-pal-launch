name: Apply admin visual system

on:
  push:
    branches:
      - redesign/dashboard-all-pages-modern

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/dashboard-all-pages-modern
      - name: Apply visual-only dashboard markers
        shell: python
        run: |
          from pathlib import Path

          shell = Path('src/components/admin/DashboardShell.tsx')
          text = shell.read_text()
          css_import = 'import "@/styles/admin-dashboard.css";\n'
          if css_import not in text:
              marker = 'import { useDashboardLanguage } from "@/lib/dashboardI18n";\n'
              text = text.replace(marker, marker + css_import, 1)
          text = text.replace(
              'className="min-h-screen bg-[#f6f7f9] text-foreground transition-colors duration-300 dark:bg-background"',
              'className="spacecall-admin-dashboard min-h-screen bg-[#f6f7f9] text-foreground transition-colors duration-300 dark:bg-background"',
              1,
          )
          text = text.replace(
              '<main className="mx-auto w-full max-w-[1500px] px-4 py-5 sm:px-6 sm:py-6 lg:px-7 lg:py-6">',
              '<main className="spacecall-admin-content mx-auto w-full max-w-[1500px] px-4 py-5 sm:px-6 sm:py-6 lg:px-7 lg:py-6">',
              1,
          )
          shell.write_text(text)

          page_files = [
              'src/routes/dashboard.index.tsx',
              'src/components/admin/CollectionEditor.tsx',
              'src/components/admin/ProductEditor.tsx',
              'src/components/admin/OrdersEditor.tsx',
              'src/components/admin/InventoryEditor.tsx',
              'src/components/admin/CustomersEditor.tsx',
              'src/components/admin/SettingsEditor.tsx',
          ]
          for name in page_files:
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  '<section className="space-y-5">',
                  '<section className="admin-page space-y-5">',
                  1,
              )
              text = text.replace(
                  '<header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">',
                  '<header className="admin-page-header flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">',
                  1,
              )
              text = text.replace(
                  '<header className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">',
                  '<header className="admin-page-header flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">',
                  1,
              )
              if name.endswith(('ProductEditor.tsx', 'OrdersEditor.tsx', 'CustomersEditor.tsx')):
                  text = text.replace(
                      '<aside className="rounded-2xl border border-border/70 bg-card p-3',
                      '<aside className="admin-list-panel rounded-2xl border border-border/70 bg-card p-3',
                      1,
                  )
              path.write_text(text)

      - name: Commit markers
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin src/routes/dashboard.index.tsx
          git commit -m "Apply modern dashboard visual markers"
          git push origin HEAD:redesign/dashboard-all-pages-modern
