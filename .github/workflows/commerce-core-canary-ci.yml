name: Commerce Core Canary CI

on:
  push:
    branches:
      - rust-core-step-4-canary
    paths:
      - "src/lib/commerceCoreCanary.ts"
      - "e2e/commerce-core-canary.test.mjs"
      - ".env.example"
      - ".github/workflows/commerce-core-canary-ci.yml"
  pull_request:
    paths:
      - "src/lib/commerceCoreCanary.ts"
      - "e2e/commerce-core-canary.test.mjs"
      - ".env.example"
      - ".github/workflows/commerce-core-canary-ci.yml"

permissions:
  contents: read

concurrency:
  group: commerce-core-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Canary formatting
        run: bunx prettier --check src/lib/commerceCoreCanary.ts e2e/commerce-core-canary.test.mjs .github/workflows/commerce-core-canary-ci.yml

      - name: Canary ESLint
        run: bunx eslint src/lib/commerceCoreCanary.ts e2e/commerce-core-canary.test.mjs

      - name: Unit and architecture tests
        run: bun run test:unit

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
