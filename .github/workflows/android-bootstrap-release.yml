name: Build Space Call Android release

on:
  pull_request:
    branches:
      - main
    paths:
      - android/**
      - public/manifest.webmanifest
      - src/routes/__root.tsx
      - .github/workflows/android-bootstrap-release.yml

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Validate web app manifest
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"
          grep -q 'rel: "manifest"' src/routes/__root.tsx

      - name: Create private upload key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="spacecall-upload"
          KEYSTORE_PATH="$RUNNER_TEMP/space-call-upload.jks"

          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keytool -genkeypair -v             -keystore "$KEYSTORE_PATH"             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias "$KEY_ALIAS"             -keyalg RSA             -keysize 4096             -validity 9125             -dname "CN=Space Call, OU=Mobile, O=Space Call, L=Beirut, C=LB"

          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')"

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_CERT_SHA256=$CERT_SHA256"
          } >> "$GITHUB_ENV"

      - name: Android lint and release builds
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintRelease
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:bundleRelease

      - name: Package APK, AAB, signing key, and Digital Asset Link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android

          cp android/app/build/outputs/apk/release/app-release.apk dist/android/Space-Call-1.0.0-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/android/Space-Call-1.0.0-release.aab
          cp "$ANDROID_KEYSTORE_PATH" dist/android/space-call-upload-key.jks

          cat > dist/android/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "store.spacecallapp.app",
                "sha256_cert_fingerprints": ["$ANDROID_CERT_SHA256"]
              }
            }
          ]
          EOF

          cat > dist/android/KEEP-PRIVATE-release-key.txt <<EOF
          SPACE CALL ANDROID RELEASE KEY — KEEP PRIVATE

          Package: store.spacecallapp.app
          Key alias: $ANDROID_KEY_ALIAS
          Keystore password: $ANDROID_KEYSTORE_PASSWORD
          Key password: $ANDROID_KEY_PASSWORD
          SHA-256 certificate fingerprint: $ANDROID_CERT_SHA256

          Keep space-call-upload-key.jks and this file in a secure backup.
          Do not commit either file to GitHub.
          Future updates must use this upload key unless the Play Console upload key is formally reset.
          EOF

          sha256sum             dist/android/Space-Call-1.0.0-release.apk             dist/android/Space-Call-1.0.0-release.aab             > dist/android/SHA256SUMS.txt

      - name: Upload Android release bundle
        uses: actions/upload-artifact@v4
        with:
          name: space-call-android-release
          path: dist/android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
