name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Semantic lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repository currently has broad pre-existing Prettier debt. Keep CI
      # focused on semantic ESLint rules so unrelated formatting does not mask
      # actual correctness failures in a production PR.
      - name: Semantic lint
        run: bunx eslint . --rule 'prettier/prettier: off'

      - name: Unit tests
        run: bun run test:unit

      - name: Production build
        run: bun run build
