name: Smart Image Editor CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/dashboard/components/SmartImageEditor.tsx"
      - "src/dashboard/components/DashboardMediaPicker.tsx"
      - "src/dashboard/components/brands/BrandForm.tsx"
      - "src/dashboard/components/categories/CategoryForm.tsx"
      - "src/dashboard/components/products/ProductMediaManager.tsx"
      - "src/dashboard/components/products/ProductVariantManager.tsx"
      - "src/dashboard/pages/HeroBannersPage.tsx"
      - "src/dashboard/pages/MediaLibraryPage.tsx"
      - "src/dashboard/pages/SettingsPage.tsx"
      - "e2e/dashboard-smart-image-editor.test.mjs"
      - ".github/workflows/smart-image-editor-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/dashboard/components/SmartImageEditor.tsx"
      - "src/dashboard/components/DashboardMediaPicker.tsx"
      - "src/dashboard/components/brands/BrandForm.tsx"
      - "src/dashboard/components/categories/CategoryForm.tsx"
      - "src/dashboard/components/products/ProductMediaManager.tsx"
      - "src/dashboard/components/products/ProductVariantManager.tsx"
      - "src/dashboard/pages/HeroBannersPage.tsx"
      - "src/dashboard/pages/MediaLibraryPage.tsx"
      - "src/dashboard/pages/SettingsPage.tsx"
      - "e2e/dashboard-smart-image-editor.test.mjs"
      - ".github/workflows/smart-image-editor-ci.yml"

permissions:
  contents: read

concurrency:
  group: smart-image-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Smart image editor regression
        run: node --test e2e/dashboard-smart-image-editor.test.mjs

      - name: Production build
        run: bun run build
