name: Dependency Refresh

on:
  push:
    branches:
      - deps/fix-2026-09-13

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: deps/fix-2026-09-13

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh lockfile
        run: bun install

      - name: Verify production build
        run: bun run build

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh lockfile after dependency updates"
          git push origin HEAD:deps/fix-2026-09-13

      - name: Run unit tests
        continue-on-error: true
        run: bun run test:unit
