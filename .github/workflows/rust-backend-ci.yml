name: Rust Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/rust-backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/rust-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Compile release binary
        run: cargo build --release --locked

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rust-backend-cargo-lock
          path: backend/Cargo.lock
          if-no-files-found: error
          retention-days: 1
