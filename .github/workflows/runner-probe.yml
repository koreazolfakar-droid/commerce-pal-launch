    branches:
      - fix/android-production-foundation-20260924
    paths:
      - ".github/workflows/runner-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner is alive
        run: echo "GitHub Actions runner is working"
