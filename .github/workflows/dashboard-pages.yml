name: Dashboard GitHub Pages Preview

on:
  push:
    branches:
      - feature/spacecall-admin-dashboard
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "dashboard-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Build dashboard for GitHub Pages
        working-directory: dashboard
        env:
          VITE_SPACE_CALL_API_URL: https://spacecallapp.store
        run: npm run build -- --base=/commerce-pal-launch/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
