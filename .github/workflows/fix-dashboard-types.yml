name: Fix dashboard exact optional types

on:
  push:
    branches:
      - feature/production-dashboard-reference

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-dashboard-reference
      - name: Fix exact optional prop types
        shell: python
        run: |
          from pathlib import Path

          sidebar = Path('src/dashboard/components/DashboardSidebar.tsx')
          text = sidebar.read_text()
          text = text.replace('badge?: number;\n  onNavigate?: () => void;', 'badge?: number | undefined;\n  onNavigate?: (() => void) | undefined;')
          sidebar.write_text(text)

          stat = Path('src/dashboard/components/StatCard.tsx')
          text = stat.read_text()
          text = text.replace('trend?: DashboardTrend;\n  comparisonLabel?: string;\n  warningIncrease?: boolean;\n  loading?: boolean;', 'trend?: DashboardTrend | undefined;\n  comparisonLabel?: string | undefined;\n  warningIncrease?: boolean | undefined;\n  loading?: boolean | undefined;')
          text = text.replace('trend?: DashboardTrend;\n  warningIncrease?: boolean;', 'trend?: DashboardTrend | undefined;\n  warningIncrease?: boolean | undefined;')
          stat.write_text(text)
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/components/DashboardSidebar.tsx src/dashboard/components/StatCard.tsx
          git commit -m "Fix dashboard exact optional prop types"
          git push origin HEAD:feature/production-dashboard-reference
