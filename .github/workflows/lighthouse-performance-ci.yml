name: Lighthouse Performance CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lighthouse-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build production storefront
        run: NITRO_PRESET=node-server bun run build

      - name: Capture bundle diagnostics
        run: |
          find .output/public/assets -maxdepth 1 -type f -printf '%s %p\n' | sort -nr > /tmp/build-assets.txt
          largest_js="$(find .output/public/assets -maxdepth 1 -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -n "$largest_js" ] && [ -f "$largest_js" ]; then
            cp "$largest_js" /tmp/lighthouse-main.js
          fi

      - name: Start production storefront with Shopify fixture
        run: |
          PORT=4173 HOST=0.0.0.0 NODE_OPTIONS="--import ./e2e/shopify-fixture.mjs" \
            node .output/server/index.mjs > /tmp/lighthouse-server.log 2>&1 &
          echo $! > /tmp/lighthouse-server.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lighthouse-server.log
          exit 1

      - name: Run mobile and desktop Lighthouse
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          bunx lighthouse@13.4.1 http://127.0.0.1:4173/ \
            --output=json \
            --output-path=/tmp/lighthouse-mobile.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
          bunx lighthouse@13.4.1 http://127.0.0.1:4173/ \
            --preset=desktop \
            --output=json \
            --output-path=/tmp/lighthouse-desktop.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Enforce green Core Web Vitals lab targets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            ['mobile', '/tmp/lighthouse-mobile.json'],
            ['desktop', '/tmp/lighthouse-desktop.json'],
          ];
          const lines = [];
          let failed = false;
          const emit = (line) => {
            lines.push(line);
            console.log(line);
          };
          for (const [label, file] of files) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const audits = report.audits;
            const score = Math.round((report.categories.performance.score ?? 0) * 100);
            const fcp = audits['first-contentful-paint'].numericValue;
            const lcp = audits['largest-contentful-paint'].numericValue;
            const tbt = audits['total-blocking-time'].numericValue;
            const cls = audits['cumulative-layout-shift'].numericValue;
            const speedIndex = audits['speed-index'].numericValue;
            emit(`${label}: performance=${score}, FCP=${Math.round(fcp)}ms, LCP=${Math.round(lcp)}ms, TBT=${Math.round(tbt)}ms, CLS=${cls.toFixed(3)}, SI=${Math.round(speedIndex)}ms`);

            const layoutItems = audits['layout-shifts']?.details?.items ?? [];
            if (layoutItems.length) {
              emit(`${label} top layout shifts:`);
              for (const item of layoutItems.slice(0, 8)) {
                emit(JSON.stringify({ score: item.score, node: item.node?.snippet ?? item.node?.selector ?? null }));
              }
            }
            const bootupItems = audits['bootup-time']?.details?.items ?? [];
            if (bootupItems.length) {
              emit(`${label} top JS CPU entries:`);
              for (const item of [...bootupItems].sort((a, b) => (b.total ?? 0) - (a.total ?? 0)).slice(0, 8)) {
                emit(JSON.stringify({ url: item.url, total: Math.round(item.total ?? 0), scripting: Math.round(item.scripting ?? 0) }));
              }
            }

            const green = score >= 90 && fcp <= 1800 && lcp <= 2500 && tbt <= 200 && cls <= 0.1 && speedIndex <= 3400;
            if (!green) failed = true;
          }
          fs.writeFileSync('/tmp/lighthouse-summary.txt', `${lines.join('\n')}\n`);
          if (failed) {
            console.error('Lighthouse performance gate failed: one or more metrics are outside the green range.');
            process.exit(1);
          }
          NODE

      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-diagnostics
          path: |
            /tmp/lighthouse-mobile.json
            /tmp/lighthouse-desktop.json
            /tmp/lighthouse-summary.txt
            /tmp/lighthouse-server.log
            /tmp/build-assets.txt
            /tmp/lighthouse-main.js
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop production storefront
        if: always()
        run: |
          if [ -f /tmp/lighthouse-server.pid ]; then
            kill "$(cat /tmp/lighthouse-server.pid)" 2>/dev/null || true
          fi
