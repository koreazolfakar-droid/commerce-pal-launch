name: Android CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "public/.well-known/assetlinks.json"
      - "public/manifest.webmanifest"
      - "scripts/android-security-gate.mjs"
      - ".github/workflows/android-ci.yml"
      - ".github/scripts/android-emulator-smoke-test.sh"
      - "e2e/android-ci-config.test.mjs"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "public/.well-known/assetlinks.json"
      - "public/manifest.webmanifest"
      - "scripts/android-security-gate.mjs"
      - ".github/workflows/android-ci.yml"
      - ".github/scripts/android-emulator-smoke-test.sh"
      - "e2e/android-ci-config.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build and smoke-test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Android source security gate
        run: node scripts/android-security-gate.mjs

      - name: URL policy Java 8 security tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/space-call-url-policy
          mkdir -p /tmp/space-call-url-policy/classes
          javac --release 8 -d /tmp/space-call-url-policy/classes android/app/src/main/java/store/spacecallapp/app/SpaceCallUrlPolicy.java android/security-tests/store/spacecallapp/app/SpaceCallUrlPolicySelfTest.java
          java -cp /tmp/space-call-url-policy/classes store.spacecallapp.app.SpaceCallUrlPolicySelfTest

      - name: Lint and build debug APK
        run: gradle -p android --no-daemon --stacktrace :app:lintDebug :app:assembleDebug

      - name: Verify APK identity, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          AAPT="${BUILD_TOOLS}/aapt"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"

          test -s "$APK"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$AAPT" dump badging "$APK" | tee /tmp/spacecall-apk-badging.txt
          grep -q "package: name='store.spacecallapp.app.debug'" /tmp/spacecall-apk-badging.txt
          grep -q "versionCode='3'" /tmp/spacecall-apk-badging.txt
          grep -q "versionName='1.0.2-debug'" /tmp/spacecall-apk-badging.txt

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/spacecall-apksigner.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tee /tmp/spacecall-zipalign.txt

          mkdir -p android/artifacts
          cp "$APK" android/artifacts/Space-Call-1.0.2-debug.apk
          sha256sum android/artifacts/Space-Call-1.0.2-debug.apk | tee android/artifacts/Space-Call-1.0.2-debug.apk.sha256

      - name: Emulator cold-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke-test.sh

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-call-android-debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/artifacts/Space-Call-1.0.2-debug.apk
            android/artifacts/Space-Call-1.0.2-debug.apk.sha256
            android/artifacts/RUNTIME-VALIDATED.txt
            android/app/build/reports/lint-results-debug.html
            /tmp/spacecall-apk-badging.txt
            /tmp/spacecall-apksigner.txt
            /tmp/spacecall-zipalign.txt
            /tmp/spacecall-launch.txt
            /tmp/spacecall-crash.txt
            /tmp/spacecall-logcat.txt
