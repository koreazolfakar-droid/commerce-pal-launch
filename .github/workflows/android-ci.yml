name: Android Diagnostics

on:
  push:
    branches:
      - fix/android-production-foundation-20260924
      - "feat/android-*"
  pull_request:
    paths:
      - "android/**"
      - "scripts/android-security-gate.mjs"
      - "public/.well-known/assetlinks.json"
      - "public/manifest.webmanifest"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Run repository and Android security gates
        run: |
          set -euo pipefail
          node scripts/security-gate.mjs
          node scripts/android-security-gate.mjs

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Gradle 9.6.0
        env:
          GRADLE_VERSION: "9.6.0"
          GRADLE_SHA256: "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL             "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"             -o /tmp/gradle.zip
          echo "$GRADLE_SHA256  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Lint and compile debug APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:lintDebug :app:assembleDebug

      - name: Inspect built APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          aapt dump badging "$APK" | tee /tmp/aapt-badging.txt
          grep -q "package: name='store.spacecallapp.app.debug'" /tmp/aapt-badging.txt
          grep -q "versionCode='3'" /tmp/aapt-badging.txt
          grep -q "versionName='1.0.2-debug'" /tmp/aapt-badging.txt
          apksigner verify --verbose --print-certs "$APK"
          zipalign -c -P 16 -v 4 "$APK"
