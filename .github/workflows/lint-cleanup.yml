name: Lint Cleanup

on:
  push:
    branches:
      - lint-cleanup-phase1

permissions:
  contents: write

concurrency:
  group: lint-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format files reported by Storefront CI
        run: |
          bunx prettier --write \
            e2e/storefront-consistency.test.mjs \
            src/components/HomeHero.tsx \
            src/components/HomeSections.tsx \
            src/components/InfoPage.tsx \
            src/components/MobileMenu.tsx \
            src/components/ProductListCard.tsx \
            src/components/StoreLayout.tsx \
            src/components/TopBrands.tsx \
            src/components/admin/CollectionEditor.tsx \
            src/integrations/supabase/auth-attacher.ts \
            src/integrations/supabase/auth-middleware.ts \
            src/integrations/supabase/client.server.ts \
            src/integrations/supabase/client.ts \
            src/integrations/supabase/cron-auth.ts \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/cms.ts \
            src/lib/infoPages.ts \
            src/lib/seo.ts \
            src/lib/shopifyDocuments.ts \
            src/routes/ar.tsx \
            src/routes/index.tsx \
            'src/routes/product.$handle.tsx' \
            supabase/functions/public-cms/index.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- \
              e2e/storefront-consistency.test.mjs \
              src/components/HomeHero.tsx \
              src/components/HomeSections.tsx \
              src/components/InfoPage.tsx \
              src/components/MobileMenu.tsx \
              src/components/ProductListCard.tsx \
              src/components/StoreLayout.tsx \
              src/components/TopBrands.tsx \
              src/components/admin/CollectionEditor.tsx \
              src/integrations/supabase/auth-attacher.ts \
              src/integrations/supabase/auth-middleware.ts \
              src/integrations/supabase/client.server.ts \
              src/integrations/supabase/client.ts \
              src/integrations/supabase/cron-auth.ts \
              src/integrations/supabase/previewAuthStorage.ts \
              src/integrations/supabase/types.ts \
              src/lib/cms.ts \
              src/lib/infoPages.ts \
              src/lib/seo.ts \
              src/lib/shopifyDocuments.ts \
              src/routes/ar.tsx \
              src/routes/index.tsx \
              'src/routes/product.$handle.tsx' \
              supabase/functions/public-cms/index.ts
            git commit -m "style: format files failing storefront lint"
            git push origin HEAD:lint-cleanup-phase1
          fi

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit and architecture tests
        if: success()
        run: bun run test:unit

      - name: Production build
        if: success()
        run: bun run build

      - name: SSR smoke test
        if: success()
        run: bun run test:ssr
