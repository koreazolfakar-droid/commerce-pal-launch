name: UGREEN Logo Validation

on:
  push:
    branches:
      - fix/ugreen-padded-logo-fit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Brand regression test
        run: node --test e2e/storefront-consistency.test.mjs

      - name: Production build
        run: bun run build

      - name: SSR smoke test
        run: bun run test:ssr
