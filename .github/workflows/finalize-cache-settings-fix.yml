name: Finalize cache and settings build fix

on:
  push:
    branches:
      - fix/finalize-cache-settings-build

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted repair
        run: python3 .github/scripts/finalize_cache_settings_fix.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --numstat src/components/admin/SettingsEditor.tsx src/lib/shopify.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit verified repair
        run: |
          rm .github/workflows/finalize-cache-settings-fix.yml
          rm .github/scripts/finalize_cache_settings_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix settings schema fields and cache stale TTL"
          git push origin HEAD:${{ github.ref_name }}
