version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Asia/Beirut"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      security-and-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
