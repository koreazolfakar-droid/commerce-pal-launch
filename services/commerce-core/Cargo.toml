[package]
name = "space-call-commerce-core"
version = "0.2.0"
edition = "2021"
description = "Isolated Rust data core for Space Call"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
worker = "0.8.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = false
